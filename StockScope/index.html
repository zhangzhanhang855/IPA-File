<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gemini Studio Pro — Apple HIG Orchestrator & Chart Analytics</title>
<style>
/* ==========================================================================
   1. APPLE HIG THEME SYSTEM (Frosted Glassmorphism, Vibrancy, San Francisco)
   ========================================================================== */
:root {
  --system-bg: #000000;
  --surface-translucent: rgba(28, 28, 30, 0.65);
  --surface-card: rgba(44, 44, 46, 0.55);
  --surface-card-hover: rgba(58, 58, 60, 0.7);
  --surface-elevated: rgba(36, 36, 38, 0.85);
  --surface-border: rgba(255, 255, 255, 0.12);
  --surface-highlight: rgba(255, 255, 255, 0.18);
  --surface-separator: rgba(255, 255, 255, 0.08);

  --apple-blue: #0A84FF;
  --apple-blue-rgb: 10, 132, 255;
  --apple-cyan: #64D2FF;
  --apple-green: #30D158;
  --apple-yellow: #FFD60A;
  --apple-orange: #FF9F0A;
  --apple-red: #FF453A;
  --apple-purple: #BF5AF2;
  --apple-indigo: #5E5CE6;
  
  --text-primary: #FFFFFF;
  --text-secondary: rgba(235, 235, 245, 0.6);
  --text-tertiary: rgba(235, 235, 245, 0.38);
  --text-quaternary: rgba(235, 235, 245, 0.2);

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-pill: 9999px;

  --spring-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  
  --sidebar-w: 280px;
  --header-h: 56px;
  --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", Monaco, Menlo, Consolas, "Cascadia Code", monospace;
  
  --shadow-window: 0 40px 100px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--surface-border);
  --shadow-popup: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--system-bg);
  font-family: var(--font-stack);
  color: var(--text-primary);
  user-select: none;
}

/* Vibrancy Background Ambient */
.ambient-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(1000px 600px at 10% 10%, rgba(var(--apple-blue-rgb), 0.15), transparent 70%),
    radial-gradient(900px 500px at 90% 20%, rgba(191, 90, 242, 0.12), transparent 60%),
    radial-gradient(800px 800px at 50% 90%, rgba(48, 209, 88, 0.08), transparent 70%),
    linear-gradient(180deg, #090A0F 0%, #030407 100%);
}

.ambient-canvas::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* ==========================================================================
   2. APP CONTAINER & MASTER LAYOUT
   ========================================================================== */
#app {
  position: relative;
  z-index: 1;
  width: 100vw;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

.sidebar {
  width: var(--sidebar-w);
  height: 100%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--surface-separator);
  background: rgba(20, 20, 22, 0.6);
  backdrop-filter: blur(35px);
  transition: width 0.3s var(--spring-smooth);
  flex-shrink: 0;
  z-index: 10;
}

.sidebar-header {
  height: var(--header-h);
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--surface-separator);
}

.window-traffic-lights {
  display: flex;
  gap: 8px;
}

.traffic-light {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
  cursor: pointer;
}
.traffic-close { background: #FF5F56; border: 0.5px solid #E0443E; }
.traffic-min { background: #FFBD2E; border: 0.5px solid #DEA123; }
.traffic-max { background: #27C93F; border: 0.5px solid #1AAB29; }

.sidebar-nav {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
}

.nav-item.active {
  background: rgba(var(--apple-blue-rgb), 0.18);
  color: var(--apple-blue);
  box-shadow: inset 0 0 0 1px rgba(var(--apple-blue-rgb), 0.3);
}

.nav-item .icon {
  font-size: 16px;
  width: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.session-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  margin-top: 10px;
  padding: 0 12px 12px;
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  text-transform: uppercase;
  padding: 6px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.session-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.session-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.session-row:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-primary);
}

.session-row.active {
  background: rgba(255, 255, 255, 0.09);
  color: var(--text-primary);
  font-weight: 500;
}

.session-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-delete-btn {
  opacity: 0;
  transition: opacity 0.15s;
  color: var(--text-tertiary);
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 2px 4px;
  border-radius: var(--radius-xs);
}
.session-row:hover .session-delete-btn { opacity: 1; }
.session-delete-btn:hover { color: var(--apple-red); }

/* Main Stage */
.main-stage {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  background: rgba(14, 14, 16, 0.4);
}

.stage-header {
  height: var(--header-h);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--surface-separator);
  z-index: 5;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.status-capsule {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--surface-border);
  font-size: 11.5px;
  color: var(--text-secondary);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--apple-green);
  box-shadow: 0 0 8px var(--apple-green);
}

.status-dot.idle { background: var(--apple-green); box-shadow: 0 0 8px var(--apple-green); }
.status-dot.busy { background: var(--apple-yellow); box-shadow: 0 0 8px var(--apple-yellow); animation: pulse 1s infinite; }
.status-dot.error { background: var(--apple-red); box-shadow: 0 0 8px var(--apple-red); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Buttons (Apple HIG Tactile) */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--surface-border);
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.15s var(--spring-smooth);
  user-select: none;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-0.5px);
}

.btn:active {
  transform: translateY(0.5px) scale(0.98);
}

.btn-primary {
  background: var(--apple-blue);
  border-color: rgba(255, 255, 255, 0.3);
  color: #FFFFFF;
  box-shadow: 0 4px 14px rgba(var(--apple-blue-rgb), 0.35);
}

.btn-primary:hover {
  background: #2591FF;
  box-shadow: 0 6px 20px rgba(var(--apple-blue-rgb), 0.5);
}

.btn-success {
  background: rgba(48, 209, 88, 0.2);
  border-color: rgba(48, 209, 88, 0.4);
  color: var(--apple-green);
}

.btn-success:hover {
  background: rgba(48, 209, 88, 0.3);
}

.btn-danger {
  background: rgba(255, 69, 58, 0.15);
  border-color: rgba(255, 69, 58, 0.3);
  color: var(--apple-red);
}

.btn-danger:hover {
  background: rgba(255, 69, 58, 0.25);
}

.btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: var(--radius-sm);
}

/* View Canvas Stacks */
.view-viewport {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.view-panel {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  overflow-y: auto;
}

.view-panel.active {
  display: flex;
}

/* ==========================================================================
   3. CHAT VIEW
   ========================================================================== */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.messages-scrollable {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.chat-bubble-wrap {
  display: flex;
  flex-direction: column;
  max-width: 82%;
  animation: bubblePop 0.25s var(--spring-smooth) forwards;
}

.chat-bubble-wrap.user {
  align-self: flex-end;
  align-items: flex-end;
}

.chat-bubble-wrap.model {
  align-self: flex-start;
  align-items: flex-start;
}

.chat-bubble-meta {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 4px;
}

.chat-bubble {
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  line-height: 1.6;
  position: relative;
  word-break: break-word;
  user-select: text;
}

.chat-bubble-wrap.user .chat-bubble {
  background: var(--apple-blue);
  color: #FFFFFF;
  border-bottom-right-radius: var(--radius-xs);
  box-shadow: 0 4px 12px rgba(var(--apple-blue-rgb), 0.25);
}

.chat-bubble-wrap.model .chat-bubble {
  background: var(--surface-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--surface-border);
  color: var(--text-primary);
  border-bottom-left-radius: var(--radius-xs);
}

.chat-dock {
  padding: 16px 24px 20px;
  background: linear-gradient(180deg, transparent 0%, rgba(10, 10, 12, 0.9) 100%);
}

.chat-input-wrapper {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl);
  padding: 8px 12px 8px 18px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  box-shadow: var(--shadow-popup);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.chat-input-wrapper:focus-within {
  border-color: rgba(var(--apple-blue-rgb), 0.5);
  box-shadow: 0 0 0 3px rgba(var(--apple-blue-rgb), 0.2), var(--shadow-popup);
}

.chat-textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.4;
  resize: none;
  max-height: 160px;
  min-height: 24px;
  padding: 4px 0;
}

.chat-textarea::placeholder {
  color: var(--text-tertiary);
}

/* ==========================================================================
   4. PIPELINE ORCHESTRATOR VIEW
   ========================================================================== */
.pipeline-view {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.pipeline-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-card);
  padding: 18px 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--surface-border);
}

.pipeline-hero-text h2 {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 4px;
}

.pipeline-hero-text p {
  font-size: 13px;
  color: var(--text-secondary);
}

.pipeline-stages-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
}

.pipeline-node {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: all 0.2s var(--spring-smooth);
  position: relative;
}

.pipeline-node.running {
  border-color: var(--apple-blue);
  box-shadow: 0 0 20px rgba(var(--apple-blue-rgb), 0.25);
}

.pipeline-node.done {
  border-color: var(--apple-green);
}

.pipeline-node-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.node-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
}

.node-idx {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}

.pipeline-node-body {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 14px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.input-text, .input-select, .input-textarea {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}

.input-textarea {
  font-family: var(--font-mono);
  font-size: 12px;
  resize: vertical;
  min-height: 60px;
}

.input-text:focus, .input-select:focus, .input-textarea:focus {
  border-color: var(--apple-blue);
}

.node-output-preview {
  background: rgba(0, 0, 0, 0.4);
  border: 1px dashed var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-size: 12px;
  color: var(--text-secondary);
  max-height: 120px;
  overflow-y: auto;
  white-space: pre-wrap;
  font-family: var(--font-mono);
}

.pipeline-connector {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 20px;
  color: var(--text-tertiary);
  font-size: 16px;
}

/* ==========================================================================
   5. CHART & METRICS VIEW (新增圖表與確認保存模組)
   ========================================================================== */
.chart-view {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.chart-config-card {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.chart-control-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  align-items: flex-end;
}

.chart-canvas-card {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.chart-canvas-wrapper {
  position: relative;
  width: 100%;
  height: 340px;
  background: rgba(0, 0, 0, 0.35);
  border-radius: var(--radius-md);
  border: 1px solid var(--surface-separator);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

canvas#analyticsChart {
  width: 100% !important;
  height: 100% !important;
}

/* ==========================================================================
   6. POOL MANAGEMENT & SETTINGS MODAL
   ========================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(20px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
  animation: fadeIn 0.2s ease forwards;
}

.modal-sheet {
  width: 100%;
  max-width: 640px;
  max-height: 85vh;
  background: var(--surface-elevated);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-window);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: sheetPop 0.3s var(--spring-smooth) forwards;
}

.modal-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--surface-separator);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-header h3 {
  font-size: 16px;
  font-weight: 600;
}

.modal-body {
  padding: 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.api-pool-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
}

.api-pool-item .key-preview {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--text-secondary);
}

.key-health-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  text-transform: uppercase;
}
.key-health-tag.valid { background: rgba(48, 209, 88, 0.2); color: var(--apple-green); }
.key-health-tag.invalid { background: rgba(255, 69, 58, 0.2); color: var(--apple-red); }

/* ==========================================================================
   7. TOAST NOTIFICATIONS
   ========================================================================== */
.toast-manager {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background: var(--surface-elevated);
  border: 1px solid var(--surface-border);
  box-shadow: var(--shadow-popup);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  animation: toastIn 0.3s var(--spring-smooth) forwards;
}

/* Animations */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetPop { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes bubblePop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }
</style>
</head>
<body>

<div class="ambient-canvas"></div>

<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="window-traffic-lights">
        <span class="traffic-light traffic-close" title="Close"></span>
        <span class="traffic-light traffic-min" title="Minimize"></span>
        <span class="traffic-light traffic-max" title="Maximize"></span>
      </div>
      <button class="btn btn-icon" id="btnNewSession" title="新建對話 (⌘N)">＋</button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-item active" data-view="chatView">
        <span class="icon">💬</span>
        <span>Gemini 對話</span>
      </div>
      <div class="nav-item" data-view="pipelineView">
        <span class="icon">⚡️</span>
        <span>多流水線 Matrix</span>
      </div>
      <div class="nav-item" data-view="chartView">

<script>
'use strict';

/**
 * GEMINI STUDIO ARCHITECTURE & CHART ENGINE
 */
const Store = {
  activeView: 'chatView',
  sessions: [],
  activeSessionId: null,
  apiKeys: [],
  currentKeyIndex: 0,
  defaultModel: 'gemini-2.5-flash',
  modelsRegistry: [
    'gemini-2.5-flash',
    'gemini-2.5-pro',
    'gemini-2.0-flash',
    'gemini-2.0-flash-lite'
  ],
  // 圖表持久化設定
  chartConfig: {
    type: 'line',
    metric: 'tokens',
    color: '#0A84FF',
    dataPoints: [28, 45, 36, 68, 84, 72, 110, 95]
  },
  pipelineStages: [
    {
      id: 'stg_1',
      title: '第一階段：核心問題解析與提取',
      model: 'gemini-2.5-flash',
      systemPrompt: '你是一名資深分析專家，請條理清晰地解析輸入內容的核心問題與約束條件。',
      temperature: 0.2,
      lastOutput: ''
    },
    {
      id: 'stg_2',
      title: '第二階段：架構設計與優化方案',
      model: 'gemini-2.5-flash',
      systemPrompt: '你是一名解決方案工程師，請依據先前的分析給出最佳解決方案與架構路徑。',
      temperature: 0.4,
      lastOutput: ''
    },
    {
      id: 'stg_3',
      title: '第三階段：代碼生成與最終驗收',
      model: 'gemini-2.5-pro',
      systemPrompt: '你是一名代碼評審專家，請輸出可直接執行的代碼並附帶單元測試。',
      temperature: 0.1,
      lastOutput: ''
    }
  ]
};

// 本地存儲管理
function saveStore() {
  localStorage.setItem('GEMINI_STUDIO_STORE_V2', JSON.stringify({
    sessions: Store.sessions,
    activeSessionId: Store.activeSessionId,
    apiKeys: Store.apiKeys,
    defaultModel: Store.defaultModel,
    pipelineStages: Store.pipelineStages,
    chartConfig: Store.chartConfig
  }));
}

function loadStore() {
  try {
    const raw = localStorage.getItem('GEMINI_STUDIO_STORE_V2');
    if (raw) {
      const parsed = JSON.parse(raw);
      Store.sessions = parsed.sessions || [];
      Store.activeSessionId = parsed.activeSessionId || null;
      Store.apiKeys = parsed.apiKeys || [];
      Store.defaultModel = parsed.defaultModel || 'gemini-2.5-flash';
      Store.pipelineStages = parsed.pipelineStages || Store.pipelineStages;
      Store.chartConfig = parsed.chartConfig || Store.chartConfig;
    }
  } catch (err) {
    console.error('加載本地存儲失敗:', err);
  }

  if (Store.sessions.length === 0) {
    createNewSession('新工作對話');
  } else if (!Store.activeSessionId || !Store.sessions.find(s => s.id === Store.activeSessionId)) {
    Store.activeSessionId = Store.sessions[0].id;
  }
}

// 輪詢 API Key 負載均衡
function getNextAvailableApiKey() {
  if (!Store.apiKeys || Store.apiKeys.length === 0) {
    throw new Error('未檢測到 Gemini API Key，請點擊左下角「設定」配置金鑰。');
  }
  const keyObj = Store.apiKeys[Store.currentKeyIndex % Store.apiKeys.length];
  Store.currentKeyIndex++;
  return keyObj.key;
}

// Toast 通知組件
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  
  let icon = 'ℹ️';
  if (type === 'success') icon = '✅';
  if (type === 'error') icon = '❌';
  if (type === 'warn') icon = '⚠️';

  toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    setTimeout(() => toast.remove(), 300);
  }, 3200);
}

// Gemini 核心 API 請求
async function callGeminiApi({ model, contents, systemInstruction, temperature = 0.7 }) {
  const apiKey = getNextAvailableApiKey();
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;

  const payload = {
    contents: contents,
    generationConfig: {
      temperature: parseFloat(temperature),
      maxOutputTokens: 8192
    }
  };

  if (systemInstruction) {
    payload.systemInstruction = {
      parts: [{ text: systemInstruction }]
    };
  }

  const response = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    const errorDetails = await response.text();
    throw new Error(`API 錯誤 [HTTP ${response.status}]: ${errorDetails}`);
  }

  const data = await response.json();
  return data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
}

// 對話管理
function createNewSession(title = '新工作對話') {
  const newSession = {
    id: 'ses_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
    title: title,
    createdAt: new Date().toISOString(),
    messages: [
      {
        role: 'model',
        text: '您好！Gemini 工作台已準備就緒，您可以開始提問或切換至流水線處理複雜任務。',
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
    ]
  };
  Store.sessions.unshift(newSession);
  Store.activeSessionId = newSession.id;
  saveStore();
  renderSessionList();
  renderActiveChat();
}

function deleteSession(id, event) {
  if (event) event.stopPropagation();
  if (Store.sessions.length <= 1) {
    showToast('至少需保留一個對話會話。', 'warn');
    return;
  }
  Store.sessions = Store.sessions.filter(s => s.id !== id);
  if (Store.activeSessionId === id) {
    Store.activeSessionId = Store.sessions[0].id;
  }
  saveStore();
  renderSessionList();
  renderActiveChat();
  showToast('對話已刪除', 'info');
}

function getActiveSession() {
  return Store.sessions.find(s => s.id === Store.activeSessionId);
}

// 渲染對話列表
function renderSessionList() {
  const container = document.getElementById('sessionList');
  container.innerHTML = '';
  document.getElementById('sessionCount').textContent = Store.sessions.length;

  Store.sessions.forEach(session => {
    const row = document.createElement('div');
    row.className = `session-row ${session.id === Store.activeSessionId ? 'active' : ''}`;
    row.onclick = () => {
      Store.activeSessionId = session.id;
      saveStore();
      renderSessionList();
      renderActiveChat();
    };

    row.innerHTML = `
      <div class="session-title-wrap">
        <span>💬</span>
        <span style="overflow: hidden; text-overflow: ellipsis;">${session.title}</span>
      </div>
      <button class="session-delete-btn" title="刪除對話">✕</button>
    `;

    row.querySelector('.session-delete-btn').onclick = (e) => deleteSession(session.id, e);
    container.appendChild(row);
  });
}

function renderActiveChat() {
  const session = getActiveSession();
  const container = document.getElementById('messagesContainer');
  container.innerHTML = '';
  if (!session) return;

  session.messages.forEach(msg => {
    const wrap = document.createElement('div');
    wrap.className = `chat-bubble-wrap ${msg.role}`;
    
    wrap.innerHTML = `
      <div class="chat-bubble-meta">
        <span>${msg.role === 'user' ? '您' : 'Gemini'}</span>
        <span>•</span>
        <span>${msg.timestamp || ''}</span>
      </div>
      <div class="chat-bubble">${formatMarkdownToHtml(msg.text)}</div>
    `;
    container.appendChild(wrap);
  });

  container.scrollTop = container.scrollHeight;
}

function formatMarkdownToHtml(text) {
  if (!text) return '';
  let esc = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  
  esc = esc.replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  esc = esc.replace(/`([^`]+)`/g, '<code>$1</code>');
  esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  esc = esc.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return esc.replace(/\n/g, '<br>');
}

// 發送對話訊息
async function handleSendMessage() {
  const input = document.getElementById('chatInput');
  const userText = input.value.trim();
  if (!userText) return;

  const session = getActiveSession();
  if (!session) return;

  session.messages.push({
    role: 'user',
    text: userText,
    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });

  if (session.messages.length === 2) {
    session.title = userText.slice(0, 20) + (userText.length > 20 ? '...' : '');
    renderSessionList();
  }

  input.value = '';
  input.style.height = 'auto';
  renderActiveChat();

  setGlobalStatus('busy', 'Gemini 思考中...');

  try {
    const historyPayload = session.messages.map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.text }]
    }));

    const reply = await callGeminiApi({
      model: Store.defaultModel,
      contents: historyPayload
    });

    session.messages.push({
      role: 'model',
      text: reply,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });

    saveStore();
    renderActiveChat();
    setGlobalStatus('idle', 'Gemini 就緒');
  } catch (err) {
    setGlobalStatus('error', '請求失敗');
    showToast(err.message, 'error');
    session.messages.push({
      role: 'model',
      text: `⚠️ **生成失敗:** ${err.message}`,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });
    renderActiveChat();
  }
}

// 9. 圖表繪製與「確認並保存」模組

function initChartControls() {
  const typeSelect = document.getElementById('chartTypeSelect');
  const metricSelect = document.getElementById('chartMetricSelect');
  const colorSelect = document.getElementById('chartColorSelect');
  const btnConfirm = document.getElementById('btnConfirmChartChange');

  // 還原已保存的設定
  typeSelect.value = Store.chartConfig.type || 'line';
  metricSelect.value = Store.chartConfig.metric || 'tokens';
  colorSelect.value = Store.chartConfig.color || '#0A84FF';

  // 點擊「確認」按鈕保存更改
  btnConfirm.onclick = () => {
    Store.chartConfig.type = typeSelect.value;
    Store.chartConfig.metric = metricSelect.value;
    Store.chartConfig.color = colorSelect.value;

    // 保存至 LocalStorage
    saveStore();

    // 重新繪製圖表
    renderAnalyticsChart();

    // UI 反饋
    const statusTag = document.getElementById('chartSaveStatusTag');
    statusTag.textContent = '● 已保存最新配置';
    statusTag.style.color = 'var(--apple-green)';
    
    showToast('圖表設定已確認並持久化保存！', 'success');
  };

  renderAnalyticsChart();
}

function renderAnalyticsChart() {
  const canvas = document.getElementById('analyticsChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  // 處理高清像素適配
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const { type, color, dataPoints } = Store.chartConfig;
  const width = rect.width;
  const height = rect.height;
  const padX = 40;
  const padY = 30;

  ctx.clearRect(0, 0, width, height);

  // 繪製背景參考網格
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
  ctx.lineWidth = 1;
  const gridLines = 4;
  for (let i = 0; i <= gridLines; i++) {
    const y = padY + (height - padY * 2) * (i / gridLines);
    ctx.beginPath();
    ctx.moveTo(padX, y);
    ctx.lineTo(width - padX, y);
    ctx.stroke();
  }

  const maxVal = Math.max(...dataPoints) * 1.2;
  const stepX = (width - padX * 2) / (dataPoints.length - 1);

  // 繪製柱狀圖
  if (type === 'bar') {
    const barWidth = stepX * 0.45;
    dataPoints.forEach((val, i) => {
      const x = padX + i * stepX - barWidth / 2;
      const barH = (val / maxVal) * (height - padY * 2);
      const y = height - padY - barH;

      const grad = ctx.createLinearGradient(0, y, 0, height - padY);
      grad.addColorStop(0, color);
      grad.addColorStop(1, 'rgba(0,0,0,0.1)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x, y, barWidth, barH, [6, 6, 0, 0]);
      ctx.fill();
    });
  } 
  // 繪製折線圖與面積圖
  else {
    ctx.beginPath();
    dataPoints.forEach((val, i) => {
      const x = padX + i * stepX;
      const y = height - padY - (val / maxVal) * (height - padY * 2);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });

    if (type === 'area') {
      ctx.lineTo(width - padX, height - padY);
      ctx.lineTo(padX, height - padY);
      ctx.closePath();
      const areaGrad = ctx.createLinearGradient(0, padY, 0, height - padY);
      areaGrad.addColorStop(0, color + '55');
      areaGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = areaGrad;
      ctx.fill();
    }

    // 線條描邊
    ctx.beginPath();
    dataPoints.forEach((val, i) => {
      const x = padX + i * stepX;
      const y = height - padY - (val / maxVal) * (height - padY * 2);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.stroke();

    // 節點圓點
    dataPoints.forEach((val, i) => {
      const x = padX + i * stepX;
      const y = height - padY - (val / maxVal) * (height - padY * 2);
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  }

  // 渲染標題
  const metricMap = {
    tokens: 'Token 消耗總量 (Tokens Count)',
    latency: '平均響應延遲 (Latency ms)',
    requests: '請求頻次 (Request Count)'
  };
  document.getElementById('chartDisplayTitle').textContent = `即時監控：${metricMap[Store.chartConfig.metric] || '指標視圖'}`;
}

// ==========================================================================
function renderPipelineStages() {
  const container = document.getElementById('pipelineStagesList');
  container.innerHTML = '';

  Store.pipelineStages.forEach((stage, idx) => {
    if (idx > 0) {
      const conn = document.createElement('div');
      conn.className = 'pipeline-connector';
      conn.textContent = '↓';
      container.appendChild(conn);
    }

    const node = document.createElement('div');
    node.className = 'pipeline-node';
    node.id = `node_${stage.id}`;

    node.innerHTML = `
      <div class="pipeline-node-header">
        <div class="node-badge">
          <span class="node-idx">${idx + 1}</span>
          <span>${stage.title}</span>
        </div>
        <div class="node-controls">
          <button class="btn btn-danger btn-icon" onclick="deletePipelineStage(${idx})" title="刪除此步驟">✕</button>
        </div>
      </div>
      <div class="pipeline-node-body">
        <div class="field-group">
          <label class="field-label">Gemini 模型節點</label>
          <select class="input-select" onchange="updateStageModel(${idx}, this.value)">
            ${Store.modelsRegistry.map(m => `<option value="${m}" ${m === stage.model ? 'selected' : ''}>${m}</option>`).join('')}
          </select>
          <label class="field-label" style="margin-top: 6px;">溫度 (Temperature)</label>
          <input type="number" step="0.1" min="0" max="1" class="input-text" value="${stage.temperature}" onchange="updateStageTemp(${idx}, this.value)">
        </div>
        <div class="field-group">
          <label class="field-label">系統角色與指令 (Prompt Instruction)</label>
          <textarea class="input-textarea" onchange="updateStagePrompt(${idx}, this.value)">${stage.systemPrompt}</textarea>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">本節點輸出快取</label>
        <div class="node-output-preview">${stage.lastOutput || '尚未執行該流水線節點。'}</div>
      </div>
    `;
    container.appendChild(node);
  });
}

function updateStageModel(index, val) { Store.pipelineStages[index].model = val; saveStore(); }
function updateStageTemp(index, val) { Store.pipelineStages[index].temperature = parseFloat(val); saveStore(); }
function updateStagePrompt(index, val) { Store.pipelineStages[index].systemPrompt = val; saveStore(); }

function deletePipelineStage(index) {
  if (Store.pipelineStages.length <= 1) {
    showToast('至少需保留一個流水線步驟。', 'warn');
    return;
  }
  Store.pipelineStages.splice(index, 1);
  saveStore();
  renderPipelineStages();
}

async function executePipeline() {
  const rootInput = document.getElementById('pipelineInitialPayload').value.trim();
  if (!rootInput) {
    showToast('請提供流水線初始輸入數據。', 'warn');
    return;
  }

  setGlobalStatus('busy', '執行流水線中...');
  let rollingPayload = rootInput;

  for (let i = 0; i < Store.pipelineStages.length; i++) {
    const stage = Store.pipelineStages[i];
    const nodeElem = document.getElementById(`node_${stage.id}`);
    
    if (nodeElem) {
      nodeElem.classList.add('running');
      nodeElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    try {
      const output = await callGeminiApi({
        model: stage.model,
        systemInstruction: stage.systemPrompt,
        temperature: stage.temperature,
        contents: [
          {
            role: 'user',
            parts: [{ text: `【前置步驟處理結果】：\n\n${rollingPayload}` }]
          }
        ]
      });

      stage.lastOutput = output;
      rollingPayload = output; // 自動傳遞給下一個步驟

      if (nodeElem) {
        nodeElem.classList.remove('running');
        nodeElem.classList.add('done');
        nodeElem.querySelector('.node-output-preview').textContent = output;
      }
    } catch (err) {
      if (nodeElem) nodeElem.classList.remove('running');
      setGlobalStatus('error', '流水線出錯');
      showToast(`步驟 ${i + 1} 執行失敗: ${err.message}`, 'error');
      return;
    }
  }

  saveStore();
  setGlobalStatus('idle', '流水線執行完畢');
  showToast('流水線全部節點處理成功！', 'success');
}

// API 金鑰池介面
function renderApiKeyPool() {
  const container = document.getElementById('apiKeyPoolList');
  container.innerHTML = '';

  if (Store.apiKeys.length === 0) {
    container.innerHTML = '<div style="color: var(--text-tertiary); font-size: 13px;">尚未配置金鑰，請求將受阻。</div>';
    return;
  }

  Store.apiKeys.forEach((keyObj, idx) => {
    const row = document.createElement('div');
    row.className = 'api-pool-item';
    const masked = keyObj.key.slice(0, 6) + '••••••••••••' + keyObj.key.slice(-4);
    row.innerHTML = `
      <span class="key-preview">${masked}</span>
      <span class="key-health-tag valid">就緒</span>
      <button class="btn btn-danger btn-icon" style="width: 24px; height: 24px;" onclick="removeApiKey(${idx})">✕</button>
    `;
    container.appendChild(row);
  });
}

function addApiKey() {
  const input = document.getElementById('inputNewApiKey');
  const val = input.value.trim();
  if (!val) return;
  Store.apiKeys.push({ key: val, addedAt: new Date().toISOString() });
  input.value = '';
  saveStore();
  renderApiKeyPool();
  showToast('金鑰已加入負載池', 'success');
}

function removeApiKey(index) {
  Store.apiKeys.splice(index, 1);
  saveStore();
  renderApiKeyPool();
}

async function fetchOnlineModels() {
  if (Store.apiKeys.length === 0) {
    showToast('請先新增 API Key 以便獲取模型。', 'warn');
    return;
  }
  showToast('正在連接 Google 模型清單 API...', 'info');
  try {
    const key = Store.apiKeys[0].key;
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    
    const geminiModels = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace(/^models\//, ''));

    if (geminiModels.length > 0) {
      Store.modelsRegistry = geminiModels;
      const select = document.getElementById('selectDefaultModel');
      select.innerHTML = geminiModels.map(m => `<option value="${m}">${m}</option>`).join('');
      select.value = geminiModels.includes('gemini-2.5-flash') ? 'gemini-2.5-flash' : geminiModels[0];
      renderPipelineStages();
      showToast(`成功同步 ${geminiModels.length} 個最新模型！`, 'success');
    }
  } catch (err) {
    showToast(`獲取模型失敗: ${err.message}`, 'error');
  }
}

function setGlobalStatus(state, label) {
  const dot = document.getElementById('globalStatusDot');
  const text = document.getElementById('globalStatusText');
  dot.className = `status-dot ${state}`;
  text.textContent = label;
}

// 匯出對話
function exportCurrentSession() {
  const session = getActiveSession();
  if (!session) return;
  const blob = new Blob([JSON.stringify(session, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Gemini_對話紀錄_${session.title.replace(/[^a-z0-9]/gi, '_')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('對話紀錄已成功匯出至 JSON 檔案。', 'success');
}

// 初始化
window.addEventListener('DOMContentLoaded', () => {
  loadStore();
  renderSessionList();
  renderActiveChat();
  renderPipelineStages();
  renderApiKeyPool();
  initChartControls();

  // 視圖導航切換
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      item.classList.add('active');
      const viewId = item.dataset.view;
      document.getElementById(viewId).classList.add('active');
      
      const titleMap = {
        chatView: 'Gemini 對話',
        pipelineView: '多流水線 Matrix',
        chartView: '圖表數據與指標'
      };
      document.getElementById('stageTitle').textContent = titleMap[viewId] || 'Studio';

      if (viewId === 'chartView') {
        setTimeout(renderAnalyticsChart, 50);
      }
    });
  });

  // 設定彈窗
  document.getElementById('btnOpenSettings').onclick = () => document.getElementById('settingsModal').classList.add('active');
  document.getElementById('btnCloseSettings').onclick = () => document.getElementById('settingsModal').classList.remove('active');
  document.getElementById('btnAddApiKey').onclick = addApiKey;
  document.getElementById('btnSyncOnlineModels').onclick = fetchOnlineModels;

  // 對話操作
  document.getElementById('btnNewSession').onclick = () => createNewSession();
  document.getElementById('btnExportSession').onclick = exportCurrentSession;
  document.getElementById('btnClearCurrentChat').onclick = () => {
    const session = getActiveSession();
    if (session) {
      session.messages = [];
      saveStore();
      renderActiveChat();
      showToast('對話內容已清空', 'info');
    }
  };

  // 流水線操作
  document.getElementById('btnAddPipelineStage').onclick = () => {
    Store.pipelineStages.push({
      id: 'stg_' + Date.now(),
      title: `階段 ${Store.pipelineStages.length + 1}：新增任務節點`,
      model: Store.defaultModel,
      systemPrompt: '請對前置內容進行提煉與改進。',
      temperature: 0.3,
      lastOutput: ''
    });
    saveStore();
    renderPipelineStages();
  };
  document.getElementById('btnRunPipeline').onclick = executePipeline;

  // 輸入框監聽
  const chatInput = document.getElementById('chatInput');
  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + 'px';
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSendMessage();
    }
  });

  document.getElementById('btnSendMessage').onclick = handleSendMessage;
  window.addEventListener('resize', () => {
    if (document.getElementById('chartView').classList.contains('active')) {
      renderAnalyticsChart();
    }
  });
});
</script>
</body>
</html>

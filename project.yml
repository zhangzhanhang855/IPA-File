name: StockScope
options:
  bundleIdPrefix: com.yourname
targets:
  StockScope:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [StockScope]
    dependencies:
      - target: PacketTunnel
      - framework: Frameworks/Libbox.xcframework
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
    settings:
      CODE_SIGN_ENTITLEMENTS: StockScope/StockScope.entitlements

  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources: [PacketTunnel]
    dependencies:
      - framework: Frameworks/Libbox.xcframework
      - sdk: UIKit.framework
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourname.StockScope.PacketTunnel
      CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
      OTHER_LDFLAGS:
        - $(inherited)
        - -lresolv

name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & Go
        run: |
          brew install xcodegen go
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build Libbox.xcframework
        run: |
          echo ">>> 拉取 sing-box 源码并使用 gomobile 编译 iOS 核心 ..."
          # 初始化 gomobile
          gomobile init
          
          # 克隆 sing-box 仓库
          git clone --depth=1 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          
          # 针对 iOS 编译 arm64 架构的 XCFramework
          gomobile bind -v -target=ios -tags="with_clash_api,with_quic,with_wireguard,with_ech" -o $GITHUB_WORKSPACE/Libbox.xcframework ./experimental/libbox
          
          cd $GITHUB_WORKSPACE
          if [ ! -d "Libbox.xcframework" ]; then
            echo "ERROR: Libbox.xcframework 生成失败！"
            exit 1
          fi
          echo ">>> Libbox.xcframework 编译完成！"
          ls -ld Libbox.xcframework

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App with Xcode (arm64 Device)
        run: |
          # 采用 Ad-Hoc 伪签名 ("-")，保证主 App 与 Extension 均能完成构建并正确嵌入
          xcodebuild clean build \
            -project StockScope.xcodeproj \
            -scheme StockScope \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos

      - name: Verify Executable & Package IPA
        run: |
          APP_PATH="./build/Release-iphoneos/StockScope.app"
          
          # 检查主 App 可执行文件
          if [ ! -f "$APP_PATH/StockScope" ]; then
            echo "ERROR: StockScope binary executable not found in $APP_PATH!"
            ls -la "$APP_PATH"
            exit 1
          fi
          
          # 检查网络扩展插件目录
          if [ ! -d "$APP_PATH/PlugIns" ]; then
            echo "ERROR: PlugIns directory not found! PacketTunnel was not embedded."
            ls -la "$APP_PATH"
            exit 1
          fi
          
          echo ">>> 验证 PlugIns 内容："
          ls -la "$APP_PATH/PlugIns"
          
          # 检查架构是否包含 arm64
          lipo -info "$APP_PATH/StockScope"
          
          # 清理旧目录并创建 Payload
          rm -rf Payload StockScope-unsigned.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # 确保 HTML 被放入 App 根目录
          if [ -f "StockScope/index.html" ]; then
            cp "StockScope/index.html" "Payload/StockScope.app/"
          fi
          
          # 严格以标准 IPA 结构压缩
          zip -qr StockScope-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockScope-unsigned-ipa
          path: StockScope-unsigned.ipa
          retention-days: 7

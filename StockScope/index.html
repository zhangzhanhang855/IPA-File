<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gemini Studio Pro — Apple HIG Orchestrator</title>
<style>
/* ==========================================================================
   1. APPLE HIG THEME SYSTEM (Frosted Glassmorphism, Vibrancy, San Francisco)
   ========================================================================== */
:root {
  --system-bg: #000000;
  --surface-translucent: rgba(28, 28, 30, 0.65);
  --surface-card: rgba(44, 44, 46, 0.55);
  --surface-card-hover: rgba(58, 58, 60, 0.7);
  --surface-elevated: rgba(36, 36, 38, 0.85);
  --surface-border: rgba(255, 255, 255, 0.12);
  --surface-highlight: rgba(255, 255, 255, 0.18);
  --surface-separator: rgba(255, 255, 255, 0.08);

  --apple-blue: #0A84FF;
  --apple-blue-rgb: 10, 132, 255;
  --apple-cyan: #64D2FF;
  --apple-green: #30D158;
  --apple-yellow: #FFD60A;
  --apple-orange: #FF9F0A;
  --apple-red: #FF453A;
  --apple-purple: #BF5AF2;
  --apple-indigo: #5E5CE6;
  
  --text-primary: #FFFFFF;
  --text-secondary: rgba(235, 235, 245, 0.6);
  --text-tertiary: rgba(235, 235, 245, 0.38);
  --text-quaternary: rgba(235, 235, 245, 0.2);

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-pill: 9999px;

  --spring-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --sidebar-w: 280px;
  --header-h: 56px;
  --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", Monaco, Menlo, Consolas, monospace;
  
  --shadow-window: 0 40px 100px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--surface-border);
  --shadow-popup: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--system-bg);
  font-family: var(--font-stack);
  color: var(--text-primary);
  user-select: none;
}

.ambient-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(1000px 600px at 10% 10%, rgba(var(--apple-blue-rgb), 0.15), transparent 70%),
    radial-gradient(900px 500px at 90% 20%, rgba(191, 90, 242, 0.12), transparent 60%),
    radial-gradient(800px 800px at 50% 90%, rgba(48, 209, 88, 0.08), transparent 70%),
    linear-gradient(180deg, #090A0F 0%, #030407 100%);
}

.ambient-canvas::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
  background-size: 24px 24px;
}

#app {
  position: relative;
  z-index: 1;
  width: 100vw;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

.sidebar {
  width: var(--sidebar-w);
  height: 100%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--surface-separator);
  background: rgba(20, 20, 22, 0.6);
  backdrop-filter: blur(35px);
  flex-shrink: 0;
  z-index: 10;
}

.sidebar-header {
  height: var(--header-h);
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--surface-separator);
}

.window-traffic-lights {
  display: flex;
  gap: 8px;
}

.traffic-light {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
}
.traffic-close { background: #FF5F56; border: 0.5px solid #E0443E; }
.traffic-min { background: #FFBD2E; border: 0.5px solid #DEA123; }
.traffic-max { background: #27C93F; border: 0.5px solid #1AAB29; }

.sidebar-nav {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
}

.nav-item.active {
  background: rgba(var(--apple-blue-rgb), 0.18);
  color: var(--apple-blue);
  box-shadow: inset 0 0 0 1px rgba(var(--apple-blue-rgb), 0.3);
}

.session-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  margin-top: 10px;
  padding: 0 12px 12px;
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  text-transform: uppercase;
  padding: 6px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.session-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.session-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.session-row:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-primary);
}

.session-row.active {
  background: rgba(255, 255, 255, 0.09);
  color: var(--text-primary);
  font-weight: 500;
}

.session-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-delete-btn {
  opacity: 0;
  color: var(--text-tertiary);
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 2px 4px;
}
.session-row:hover .session-delete-btn { opacity: 1; }
.session-delete-btn:hover { color: var(--apple-red); }

.main-stage {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  background: rgba(14, 14, 16, 0.4);
}

.stage-header {
  height: var(--header-h);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--surface-separator);
  z-index: 5;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-title {
  font-size: 16px;
  font-weight: 600;
}

/* 頂部模型即時切換膠囊選單 */
.header-model-picker {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--surface-border);
  padding: 3px 8px 3px 10px;
  border-radius: var(--radius-pill);
}

.header-model-picker label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
}

.header-model-select {
  background: transparent;
  border: none;
  color: var(--apple-cyan);
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  outline: none;
  cursor: pointer;
}

.header-model-select option {
  background: #1C1C1E;
  color: #FFF;
}

.status-capsule {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--surface-border);
  font-size: 11.5px;
  color: var(--text-secondary);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--apple-green);
  box-shadow: 0 0 8px var(--apple-green);
}

.status-dot.idle { background: var(--apple-green); box-shadow: 0 0 8px var(--apple-green); }
.status-dot.busy { background: var(--apple-yellow); box-shadow: 0 0 8px var(--apple-yellow); animation: pulse 1s infinite; }
.status-dot.error { background: var(--apple-red); box-shadow: 0 0 8px var(--apple-red); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--surface-border);
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.15s var(--spring-smooth);
}

.btn:hover {
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.25);
}

.btn-primary {
  background: var(--apple-blue);
  border-color: rgba(255, 255, 255, 0.3);
  color: #FFFFFF;
}

.btn-primary:hover {
  background: #2591FF;
}

.btn-danger {
  background: rgba(255, 69, 58, 0.15);
  border-color: rgba(255, 69, 58, 0.3);
  color: var(--apple-red);
}

.btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: var(--radius-sm);
}

.view-viewport {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.view-panel {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  overflow-y: auto;
}

.view-panel.active {
  display: flex;
}

/* Chat Layout */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.messages-scrollable {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.chat-bubble-wrap {
  display: flex;
  flex-direction: column;
  max-width: 82%;
  animation: bubblePop 0.25s var(--spring-smooth) forwards;
}

.chat-bubble-wrap.user {
  align-self: flex-end;
  align-items: flex-end;
}

.chat-bubble-wrap.model {
  align-self: flex-start;
  align-items: flex-start;
}

.chat-bubble-meta {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 4px;
}

.chat-model-tag {
  background: rgba(255, 255, 255, 0.08);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  color: var(--apple-cyan);
  font-family: var(--font-mono);
}

.chat-bubble {
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  line-height: 1.6;
  position: relative;
  word-break: break-word;
  user-select: text;
}

.chat-bubble-wrap.user .chat-bubble {
  background: var(--apple-blue);
  color: #FFFFFF;
  border-bottom-right-radius: var(--radius-xs);
}

.chat-bubble-wrap.model .chat-bubble {
  background: var(--surface-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--surface-border);
  color: var(--text-primary);
  border-bottom-left-radius: var(--radius-xs);
}

.chat-dock {
  padding: 16px 24px 20px;
  background: linear-gradient(180deg, transparent 0%, rgba(10, 10, 12, 0.9) 100%);
}

.chat-input-wrapper {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl);
  padding: 8px 12px 8px 18px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  box-shadow: var(--shadow-popup);
}

.chat-textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.4;
  resize: none;
  max-height: 160px;
  min-height: 24px;
  padding: 4px 0;
}

/* Pipeline UI */
.pipeline-view {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.pipeline-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-card);
  padding: 18px 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--surface-border);
}

.pipeline-stages-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.pipeline-node {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.pipeline-node.running {
  border-color: var(--apple-blue);
  box-shadow: 0 0 20px rgba(var(--apple-blue-rgb), 0.25);
}

.pipeline-node.done {
  border-color: var(--apple-green);
}

.pipeline-node-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.node-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
}

.node-idx {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}

.pipeline-node-body {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 14px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.input-text, .input-select, .input-textarea {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

.input-select option {
  background: #1C1C1E;
  color: #FFF;
}

.input-textarea {
  font-family: var(--font-mono);
  font-size: 12px;
  resize: vertical;
  min-height: 60px;
}

.node-output-preview {
  background: rgba(0, 0, 0, 0.4);
  border: 1px dashed var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-size: 12px;
  color: var(--text-secondary);
  max-height: 120px;
  overflow-y: auto;
  white-space: pre-wrap;
  font-family: var(--font-mono);
}

.pipeline-connector {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 20px;
  color: var(--text-tertiary);
  font-size: 16px;
}

/* Modal Settings */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(20px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active { display: flex; animation: fadeIn 0.2s ease forwards; }

.modal-sheet {
  width: 100%;
  max-width: 640px;
  max-height: 85vh;
  background: var(--surface-elevated);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-window);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--surface-separator);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-body {
  padding: 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.api-pool-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
}

.api-pool-item .key-preview {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--text-secondary);
}

.key-health-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  text-transform: uppercase;
  background: rgba(48, 209, 88, 0.2);
  color: var(--apple-green);
}

.toast-manager {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background: var(--surface-elevated);
  border: 1px solid var(--surface-border);
  box-shadow: var(--shadow-popup);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  animation: toastIn 0.3s var(--spring-smooth) forwards;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bubblePop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
</style>
</head>
<body>

<div class="ambient-canvas"></div>

<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="window-traffic-lights">
        <span class="traffic-light traffic-close" title="Close"></span>
        <span class="traffic-light traffic-min" title="Minimize"></span>
        <span class="traffic-light traffic-max" title="Maximize"></span>
      </div>
      <button class="btn btn-icon" id="btnNewSession" title="新建對話 (⌘N)">＋</button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-item active" data-view="chatView">
        <span class="icon">💬</span>
        <span>Gemini 對話</span>
      </div>
      <div class="nav-item" data-view="pipelineView">
        <span class="icon">⚡️</span>
        <span>多流水線 Matrix</span>
      </div>
    </nav>

    <div class="session-section">
      <div class="section-label">
        <span>歷史對話</span>
        <span id="sessionCount">0</span>
      </div>
      <div class="session-list" id="sessionList"></div>
    </div>

    <div style="padding: 12px; border-top: 1px solid var(--surface-separator);">
      <button class="btn" style="width: 100%; justify-content: flex-start;" id="btnOpenSettings">
        <span class="icon">⚙️</span>
        <span>API 金鑰池 & 設定</span>
      </button>
    </div>
  </aside>

  <!-- MAIN STAGE -->
  <main class="main-stage">
    <!-- HEADER -->
    <header class="stage-header">
      <div class="header-meta">
        <span class="header-title" id="stageTitle">Gemini 對話</span>
        
        <!-- 頂欄即時模型切換選單 -->
        <div class="header-model-picker" id="headerModelPickerWrap">
          <label>MODEL</label>
          <select class="header-model-select" id="headerModelSelect">
            <!-- 動態填充模型選項 -->
          </select>
        </div>

        <div class="status-capsule">
          <span class="status-dot idle" id="globalStatusDot"></span>
          <span id="globalStatusText">Gemini 就緒</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" id="btnExportSession" title="匯出當前對話">📤 匯出對話</button>
        <button class="btn btn-danger" id="btnClearCurrentChat" title="清空對話上下文">清空上下文</button>
      </div>
    </header>

    <!-- VIEWS -->
    <div class="view-viewport">
      <!-- 1. CHAT VIEW -->
      <section class="view-panel active" id="chatView">
        <div class="chat-container">
          <div class="messages-scrollable" id="messagesContainer"></div>
          <div class="chat-dock">
            <div class="chat-input-wrapper">
              <textarea class="chat-textarea" id="chatInput" placeholder="輸入訊息至 Gemini API (Shift+Enter 換行)..." rows="1"></textarea>
              <button class="btn btn-primary" id="btnSendMessage">發送</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 2. PIPELINE VIEW -->
      <section class="view-panel" id="pipelineView">
        <div class="pipeline-view">
          <div class="pipeline-hero">
            <div>
              <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">Gemini 多階工作流水線</h2>
              <p style="font-size: 12.5px; color: var(--text-secondary);">自動將前置步驟的分析結果傳遞給後續節點處理。</p>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn" id="btnAddPipelineStage">＋ 新增步驟</button>
              <button class="btn btn-primary" id="btnRunPipeline">🚀 執行流水線</button>
            </div>
          </div>

          <div class="field-group" style="background: var(--surface-card); padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--surface-border);">
            <label class="field-label">流水線初始輸入數據 / Payload</label>
            <textarea class="input-textarea" id="pipelineInitialPayload" placeholder="輸入要交由第一個模型處理的初始任務或上下文..." style="min-height: 80px;"></textarea>
          </div>

          <div class="pipeline-stages-container" id="pipelineStagesList"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h3>Gemini API 設定與金鑰池</h3>
      <button class="btn btn-icon" id="btnCloseSettings">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label">新增 Gemini API Key 至金鑰池</label>
        <div style="display: flex; gap: 8px;">
          <input type="password" class="input-text" id="inputNewApiKey" placeholder="AIzaSy..." style="flex: 1;">
          <button class="btn btn-primary" id="btnAddApiKey">加入金鑰</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">已啟用的 API 金鑰池</label>
        <div id="apiKeyPoolList" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>

      <div class="field-group">
        <label class="field-label">全域預設模型切換</label>
        <div style="display: flex; gap: 8px;">
          <select class="input-select" id="selectDefaultModel" style="flex: 1;">
            <!-- 自動同步所有可用模型 -->
          </select>
          <button class="btn" id="btnSyncOnlineModels">🔄 線上同步模型清單</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-manager" id="toastContainer"></div>

<!-- SCRIPT LOGIC -->
<script>
'use strict';

const Store = {
  activeView: 'chatView',
  sessions: [],
  activeSessionId: null,
  apiKeys: [],
  currentKeyIndex: 0,
  defaultModel: 'gemini-2.5-flash',
  modelsRegistry: [
    'gemini-2.5-flash',
    'gemini-2.5-pro',
    'gemini-2.0-flash',
    'gemini-2.0-flash-lite'
  ],
  pipelineStages: [
    {
      id: 'stg_1',
      title: '第一階段：核心問題解析',
      model: 'gemini-2.5-flash',
      systemPrompt: '你是一名資深分析專家，請條理清晰地解析輸入內容的核心要點。',
      temperature: 0.2,
      lastOutput: ''
    },
    {
      id: 'stg_2',
      title: '第二階段：生成解決方案',
      model: 'gemini-2.5-pro',
      systemPrompt: '你是一名頂級架構師，請針對先前的分析給出最佳落地方案。',
      temperature: 0.4,
      lastOutput: ''
    }
  ]
};

function saveStore() {
  localStorage.setItem('GEMINI_STUDIO_STORE_V3', JSON.stringify({
    sessions: Store.sessions,
    activeSessionId: Store.activeSessionId,
    apiKeys: Store.apiKeys,
    defaultModel: Store.defaultModel,
    modelsRegistry: Store.modelsRegistry,
    pipelineStages: Store.pipelineStages
  }));
}

function loadStore() {
  try {
    const raw = localStorage.getItem('GEMINI_STUDIO_STORE_V3');
    if (raw) {
      const parsed = JSON.parse(raw);
      Store.sessions = parsed.sessions || [];
      Store.activeSessionId = parsed.activeSessionId || null;
      Store.apiKeys = parsed.apiKeys || [];
      Store.defaultModel = parsed.defaultModel || 'gemini-2.5-flash';
      Store.modelsRegistry = parsed.modelsRegistry || Store.modelsRegistry;
      Store.pipelineStages = parsed.pipelineStages || Store.pipelineStages;
    }
  } catch (err) {
    console.error(err);
  }

  if (Store.sessions.length === 0) {
    createNewSession('新工作對話');
  } else if (!Store.activeSessionId || !Store.sessions.find(s => s.id === Store.activeSessionId)) {
    Store.activeSessionId = Store.sessions[0].id;
  }
}

function getNextAvailableApiKey() {
  if (!Store.apiKeys || Store.apiKeys.length === 0) {
    throw new Error('未配置 API Key，請至左下角「設定」新增。');
  }
  const keyObj = Store.apiKeys[Store.currentKeyIndex % Store.apiKeys.length];
  Store.currentKeyIndex++;
  return keyObj.key;
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  let icon = 'ℹ️';
  if (type === 'success') icon = '✅';
  if (type === 'error') icon = '❌';
  if (type === 'warn') icon = '⚠️';
  toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// 模型下拉選單雙向同步更新
function updateAllModelDropdowns() {
  const headerSelect = document.getElementById('headerModelSelect');
  const modalSelect = document.getElementById('selectDefaultModel');

  const renderOptions = () => {
    return Store.modelsRegistry.map(m => `<option value="${m}">${m}</option>`).join('');
  };

  headerSelect.innerHTML = renderOptions();
  modalSelect.innerHTML = renderOptions();

  // 若當前選中的模型不在註冊表中，預設選第一個
  if (!Store.modelsRegistry.includes(Store.defaultModel)) {
    Store.defaultModel = Store.modelsRegistry[0] || 'gemini-2.5-flash';
  }

  headerSelect.value = Store.defaultModel;
  modalSelect.value = Store.defaultModel;
}

// 核心請求接口
async function callGeminiApi({ model, contents, systemInstruction, temperature = 0.7 }) {
  const apiKey = getNextAvailableApiKey();
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;

  const payload = {
    contents: contents,
    generationConfig: {
      temperature: parseFloat(temperature),
      maxOutputTokens: 8192
    }
  };

  if (systemInstruction) {
    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
  }

  const response = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    const errorDetails = await response.text();
    throw new Error(`API 錯誤 [${response.status}]: ${errorDetails}`);
  }

  const data = await response.json();
  return data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
}

// 對話操作
function createNewSession(title = '新工作對話') {
  const newSession = {
    id: 'ses_' + Date.now(),
    title: title,
    messages: [
      {
        role: 'model',
        text: '您好！Gemini 工作台已準備就緒，您可以直接對話或在頂欄切換不同模型。',
        modelUsed: Store.defaultModel,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
    ]
  };
  Store.sessions.unshift(newSession);
  Store.activeSessionId = newSession.id;
  saveStore();
  renderSessionList();
  renderActiveChat();
}

function deleteSession(id, event) {
  if (event) event.stopPropagation();
  if (Store.sessions.length <= 1) {
    showToast('至少需保留一個對話', 'warn');
    return;
  }
  Store.sessions = Store.sessions.filter(s => s.id !== id);
  if (Store.activeSessionId === id) Store.activeSessionId = Store.sessions[0].id;
  saveStore();
  renderSessionList();
  renderActiveChat();
}

function getActiveSession() {
  return Store.sessions.find(s => s.id === Store.activeSessionId);
}

function renderSessionList() {
  const container = document.getElementById('sessionList');
  container.innerHTML = '';
  document.getElementById('sessionCount').textContent = Store.sessions.length;

  Store.sessions.forEach(session => {
    const row = document.createElement('div');
    row.className = `session-row ${session.id === Store.activeSessionId ? 'active' : ''}`;
    row.onclick = () => {
      Store.activeSessionId = session.id;
      saveStore();
      renderSessionList();
      renderActiveChat();
    };

    row.innerHTML = `
      <div class="session-title-wrap">
        <span>💬</span>
        <span>${session.title}</span>
      </div>
      <button class="session-delete-btn" title="刪除">✕</button>
    `;

    row.querySelector('.session-delete-btn').onclick = (e) => deleteSession(session.id, e);
    container.appendChild(row);
  });
}

function renderActiveChat() {
  const session = getActiveSession();
  const container = document.getElementById('messagesContainer');
  container.innerHTML = '';
  if (!session) return;

  session.messages.forEach(msg => {
    const wrap = document.createElement('div');
    wrap.className = `chat-bubble-wrap ${msg.role}`;
    
    wrap.innerHTML = `
      <div class="chat-bubble-meta">
        <span>${msg.role === 'user' ? '您' : 'Gemini'}</span>
        ${msg.modelUsed ? `<span class="chat-model-tag">${msg.modelUsed}</span>` : ''}
        <span>•</span>
        <span>${msg.timestamp || ''}</span>
      </div>
      <div class="chat-bubble">${formatMarkdownToHtml(msg.text)}</div>
    `;
    container.appendChild(wrap);
  });

  container.scrollTop = container.scrollHeight;
}

function formatMarkdownToHtml(text) {
  if (!text) return '';
  let esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  esc = esc.replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  esc = esc.replace(/`([^`]+)`/g, '<code>$1</code>');
  esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return esc.replace(/\n/g, '<br>');
}

async function handleSendMessage() {
  const input = document.getElementById('chatInput');
  const userText = input.value.trim();
  if (!userText) return;

  const session = getActiveSession();
  if (!session) return;

  session.messages.push({
    role: 'user',
    text: userText,
    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });

  if (session.messages.length === 2) {
    session.title = userText.slice(0, 18) + (userText.length > 18 ? '...' : '');
    renderSessionList();
  }

  input.value = '';
  renderActiveChat();
  setGlobalStatus('busy', `Gemini (${Store.defaultModel}) 思考中...`);

  try {
    const historyPayload = session.messages.map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.text }]
    }));

    // 使用當前選定的模型呼叫 API
    const reply = await callGeminiApi({
      model: Store.defaultModel,
      contents: historyPayload
    });

    session.messages.push({
      role: 'model',
      text: reply,
      modelUsed: Store.defaultModel,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });

    saveStore();
    renderActiveChat();
    setGlobalStatus('idle', 'Gemini 就緒');
  } catch (err) {
    setGlobalStatus('error', '請求錯誤');
    showToast(err.message, 'error');
    session.messages.push({
      role: 'model',
      text: `⚠️ **生成失敗:** ${err.message}`,
      modelUsed: Store.defaultModel,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });
    renderActiveChat();
  }
}

// Pipeline 管理
function renderPipelineStages() {
  const container = document.getElementById('pipelineStagesList');
  container.innerHTML = '';

  Store.pipelineStages.forEach((stage, idx) => {
    if (idx > 0) {
      const conn = document.createElement('div');
      conn.className = 'pipeline-connector';
      conn.textContent = '↓';
      container.appendChild(conn);
    }

    const node = document.createElement('div');
    node.className = 'pipeline-node';
    node.id = `node_${stage.id}`;

    node.innerHTML = `
      <div class="pipeline-node-header">
        <div class="node-badge">
          <span class="node-idx">${idx + 1}</span>
          <span>${stage.title}</span>
        </div>
        <button class="btn btn-danger btn-icon" onclick="deletePipelineStage(${idx})">✕</button>
      </div>
      <div class="pipeline-node-body">
        <div class="field-group">
          <label class="field-label">Gemini 模型節點</label>
          <select class="input-select" onchange="updateStageModel(${idx}, this.value)">
            ${Store.modelsRegistry.map(m => `<option value="${m}" ${m === stage.model ? 'selected' : ''}>${m}</option>`).join('')}
          </select>
          <label class="field-label" style="margin-top: 6px;">溫度 (Temperature)</label>
          <input type="number" step="0.1" min="0" max="1" class="input-text" value="${stage.temperature}" onchange="updateStageTemp(${idx}, this.value)">
        </div>
        <div class="field-group">
          <label class="field-label">系統指令 (Prompt)</label>
          <textarea class="input-textarea" onchange="updateStagePrompt(${idx}, this.value)">${stage.systemPrompt}</textarea>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">節點輸出快取</label>
        <div class="node-output-preview">${stage.lastOutput || '尚未執行。'}</div>
      </div>
    `;
    container.appendChild(node);
  });
}

function updateStageModel(index, val) { Store.pipelineStages[index].model = val; saveStore(); }
function updateStageTemp(index, val) { Store.pipelineStages[index].temperature = parseFloat(val); saveStore(); }
function updateStagePrompt(index, val) { Store.pipelineStages[index].systemPrompt = val; saveStore(); }

function deletePipelineStage(index) {
  if (Store.pipelineStages.length <= 1) return showToast('至少需保留一個步驟', 'warn');
  Store.pipelineStages.splice(index, 1);
  saveStore();
  renderPipelineStages();
}

async function executePipeline() {
  const rootInput = document.getElementById('pipelineInitialPayload').value.trim();
  if (!rootInput) return showToast('請提供初始輸入數據', 'warn');

  setGlobalStatus('busy', '執行流水線中...');
  let rollingPayload = rootInput;

  for (let i = 0; i < Store.pipelineStages.length; i++) {
    const stage = Store.pipelineStages[i];
    const nodeElem = document.getElementById(`node_${stage.id}`);
    if (nodeElem) nodeElem.classList.add('running');

    try {
      const output = await callGeminiApi({
        model: stage.model,
        systemInstruction: stage.systemPrompt,
        temperature: stage.temperature,
        contents: [{ role: 'user', parts: [{ text: `前置輸入數據：\n\n${rollingPayload}` }] }]
      });

      stage.lastOutput = output;
      rollingPayload = output;

      if (nodeElem) {
        nodeElem.classList.remove('running');
        nodeElem.classList.add('done');
        nodeElem.querySelector('.node-output-preview').textContent = output;
      }
    } catch (err) {
      if (nodeElem) nodeElem.classList.remove('running');
      setGlobalStatus('error', '流水線出錯');
      return showToast(`步驟 ${i + 1} 失敗: ${err.message}`, 'error');
    }
  }

  saveStore();
  setGlobalStatus('idle', '流水線完成');
  showToast('流水線全部處理完成！', 'success');
}

// API Key 管理
function renderApiKeyPool() {
  const container = document.getElementById('apiKeyPoolList');
  container.innerHTML = '';
  if (Store.apiKeys.length === 0) {
    container.innerHTML = '<div style="color: var(--text-tertiary); font-size: 13px;">尚未配置金鑰</div>';
    return;
  }
  Store.apiKeys.forEach((keyObj, idx) => {
    const row = document.createElement('div');
    row.className = 'api-pool-item';
    const masked = keyObj.key.slice(0, 6) + '••••••••••••' + keyObj.key.slice(-4);
    row.innerHTML = `
      <span class="key-preview">${masked}</span>
      <span class="key-health-tag">有效</span>
      <button class="btn btn-danger btn-icon" onclick="removeApiKey(${idx})">✕</button>
    `;
    container.appendChild(row);
  });
}

function addApiKey() {
  const input = document.getElementById('inputNewApiKey');
  const val = input.value.trim();
  if (!val) return;
  Store.apiKeys.push({ key: val, addedAt: new Date().toISOString() });
  input.value = '';
  saveStore();
  renderApiKeyPool();
  showToast('金鑰已加入', 'success');
}

function removeApiKey(index) {
  Store.apiKeys.splice(index, 1);
  saveStore();
  renderApiKeyPool();
}

async function fetchOnlineModels() {
  if (Store.apiKeys.length === 0) return showToast('請先新增 API Key', 'warn');
  showToast('正在連接 Google 模型清單 API...', 'info');
  try {
    const key = Store.apiKeys[0].key;
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    
    const geminiModels = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace(/^models\//, ''));

    if (geminiModels.length > 0) {
      Store.modelsRegistry = geminiModels;
      updateAllModelDropdowns();
      saveStore();
      renderPipelineStages();
      showToast(`成功同步 ${geminiModels.length} 個可用模型！`, 'success');
    }
  } catch (err) {
    showToast(`獲取模型失敗: ${err.message}`, 'error');
  }
}

function setGlobalStatus(state, label) {
  document.getElementById('globalStatusDot').className = `status-dot ${state}`;
  document.getElementById('globalStatusText').textContent = label;
}

// 初始化
window.addEventListener('DOMContentLoaded', () => {
  loadStore();
  updateAllModelDropdowns();
  renderSessionList();
  renderActiveChat();
  renderPipelineStages();
  renderApiKeyPool();

  // 頂欄模型選單切換監聽
  const headerSelect = document.getElementById('headerModelSelect');
  const modalSelect = document.getElementById('selectDefaultModel');

  headerSelect.onchange = (e) => {
    Store.defaultModel = e.target.value;
    modalSelect.value = e.target.value;
    saveStore();
    showToast(`模型已切換至：${Store.defaultModel}`, 'info');
  };

  modalSelect.onchange = (e) => {
    Store.defaultModel = e.target.value;
    headerSelect.value = e.target.value;
    saveStore();
    showToast(`模型已切換至：${Store.defaultModel}`, 'info');
  };

  // 導航切換
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      item.classList.add('active');
      const viewId = item.dataset.view;
      document.getElementById(viewId).classList.add('active');
      document.getElementById('stageTitle').textContent = viewId === 'chatView' ? 'Gemini 對話' : '多流水線 Matrix';
    });
  });

  // 設定彈窗
  document.getElementById('btnOpenSettings').onclick = () => document.getElementById('settingsModal').classList.add('active');
  document.getElementById('btnCloseSettings').onclick = () => document.getElementById('settingsModal').classList.remove('active');
  document.getElementById('btnAddApiKey').onclick = addApiKey;
  document.getElementById('btnSyncOnlineModels').onclick = fetchOnlineModels;

  // 對話操作
  document.getElementById('btnNewSession').onclick = () => createNewSession();
  document.getElementById('btnExportSession').onclick = () => {
    const session = getActiveSession();
    if (!session) return;
    const blob = new Blob([JSON.stringify(session, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Gemini_Session_${session.title}.json`;
    a.click();
  };
  document.getElementById('btnClearCurrentChat').onclick = () => {
    const session = getActiveSession();
    if (session) {
      session.messages = [];
      saveStore();
      renderActiveChat();
      showToast('對話已清空', 'info');
    }
  };

  // 流水線操作
  document.getElementById('btnAddPipelineStage').onclick = () => {
    Store.pipelineStages.push({
      id: 'stg_' + Date.now(),
      title: `階段 ${Store.pipelineStages.length + 1}：新增任務節點`,
      model: Store.defaultModel,
      systemPrompt: '請對前置內容進行分析處理。',
      temperature: 0.3,
      lastOutput: ''
    });
    saveStore();
    renderPipelineStages();
  };
  document.getElementById('btnRunPipeline').onclick = executePipeline;

  // 輸入框
  const chatInput = document.getElementById('chatInput');
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSendMessage();
    }
  });
  document.getElementById('btnSendMessage').onclick = handleSendMessage;
});
</script>
</body>
</html>

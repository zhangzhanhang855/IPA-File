<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StockScope Proxy</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #141721;
      --input-bg: #1c2130;
      --border: #262c3d;
      --text: #f0f3f8;
      --muted: #7e8b9f;
      --accent: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px 20px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--input-bg);
      border: 1px solid var(--border);
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-disconnected .badge-dot { background: var(--muted); }
    .status-connecting .badge-dot { background: var(--yellow); }
    .status-connected .badge-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-disconnecting .badge-dot { background: var(--red); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      user-select: text;
    }
    input:focus {
      border-color: var(--accent);
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .flex-1 { flex: 1; }
    .flex-2 { flex: 2; }

    .btn-toggle {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      transition: opacity 0.2s, transform 0.1s;
      margin-top: auto;
    }
    .btn-toggle:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-toggle.active {
      background: var(--red);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">StockScope Proxy</div>
    <div id="statusBadge" class="badge status-disconnected">
      <span class="badge-dot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">AnyTLS Endpoint</div>
    <div class="row form-group">
      <div class="flex-2">
        <label>Server Host / IP</label>
        <input id="server" type="text" placeholder="1.2.3.4">
      </div>
      <div class="flex-1">
        <label>Port</label>
        <input id="port" type="number" placeholder="443" value="443">
      </div>
    </div>
    <div class="form-group">
      <label>Password / Token</label>
      <input id="password" type="text" placeholder="anytls password">
    </div>
    <div class="form-group">
      <label>SNI (Optional)</label>
      <input id="sni" type="text" placeholder="example.com">
    </div>
  </div>

  <div class="card">
    <div class="card-title">Network Setting</div>
    <div class="row form-group">
      <div class="flex-1">
        <label>Virtual TUN IP</label>
        <input id="tunIp" type="text" value="172.19.0.1">
      </div>
      <div class="flex-1">
        <label>DNS Server</label>
        <input id="dnsServer" type="text" value="1.1.1.1">
      </div>
    </div>
  </div>

  <button id="toggleBtn" class="btn-toggle" onclick="toggleProxy()">Start Proxy</button>

  <script>
    let currentStatus = "disconnected";

    // 载入本地配置
    window.onload = function() {
      const saved = localStorage.getItem("anytls_config");
      if (saved) {
        try {
          const cfg = JSON.parse(saved);
          document.getElementById("server").value = cfg.server || "";
          document.getElementById("port").value = cfg.port || 443;
          document.getElementById("password").value = cfg.password || "";
          document.getElementById("sni").value = cfg.sni || "";
          document.getElementById("tunIp").value = cfg.tunIp || "172.19.0.1";
          document.getElementById("dnsServer").value = cfg.dnsServer || "1.1.1.1";
        } catch (e) {}
      }
      postNativeMessage("getProxyStatus", null);
    };

    function saveInputs() {
      const cfg = {
        server: document.getElementById("server").value.trim(),
        port: parseInt(document.getElementById("port").value) || 443,
        password: document.getElementById("password").value.trim(),
        sni: document.getElementById("sni").value.trim(),
        tunIp: document.getElementById("tunIp").value.trim() || "172.19.0.1",
        dnsServer: document.getElementById("dnsServer").value.trim() || "1.1.1.1"
      };
      localStorage.setItem("anytls_config", JSON.stringify(cfg));
      return cfg;
    }

    function buildSingBoxConfig(c) {
      return {
        "log": { "level": "warn" },
        "dns": {
          "servers": [{ "tag": "dns-remote", "address": c.dnsServer, "detour": "proxy" }]
        },
        "inbounds": [
          {
            "type": "tun",
            "tag": "tun-in",
            "interface_name": "utun",
            "inet4_address": `${c.tunIp}/24`,
            "auto_route": true,
            "strict_route": false,
            "sniff": true
          }
        ],
        "outbounds": [
          {
            "type": "anytls",
            "tag": "proxy",
            "server": c.server,
            "server_port": c.port,
            "password": c.password,
            "tls": {
              "enabled": true,
              "server_name": c.sni || c.server
            }
          },
          { "type": "direct", "tag": "direct" }
        ],
        "route": {
          "rules": [{ "outbound": "proxy" }],
          "auto_detect_interface": true
        }
      };
    }

    function toggleProxy() {
      if (currentStatus === "connected") {
        postNativeMessage("stopProxy", null);
      } else {
        const c = saveInputs();
        if (!c.server || !c.password) {
          alert("Server and Password cannot be empty.");
          return;
        }
        const singBoxJSON = JSON.stringify(buildSingBoxConfig(c), null, 2);
        postNativeMessage("startProxy", singBoxJSON);
      }
    }

    function postNativeMessage(name, body) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers[name]) {
        window.webkit.messageHandlers[name].postMessage(body);
      }
    }

    // 由 Native 的 evaluateJavaScript 调用
    window.onProxyStatusChange = function(status) {
      currentStatus = status;
      const badge = document.getElementById("statusBadge");
      const statusText = document.getElementById("statusText");
      const btn = document.getElementById("toggleBtn");

      badge.className = `badge status-${status}`;
      statusText.innerText = status.charAt(0).toUpperCase() + status.slice(1);

      if (status === "connected") {
        btn.innerText = "Stop Proxy";
        btn.className = "btn-toggle active";
      } else if (status === "connecting") {
        btn.innerText = "Connecting...";
        btn.className = "btn-toggle";
      } else {
        btn.innerText = "Start Proxy";
        btn.className = "btn-toggle";
      }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Universal AI Studio — Apple HIG Multi-Platform Orchestrator</title>
<style>
/* ==========================================================================
   1. APPLE HIG THEME SYSTEM (Vibrancy, Frosted Glass, Typography)
   ========================================================================== */
:root {
  --system-bg: #000000;
  --surface-translucent: rgba(28, 28, 30, 0.65);
  --surface-card: rgba(44, 44, 46, 0.55);
  --surface-card-hover: rgba(58, 58, 60, 0.7);
  --surface-elevated: rgba(36, 36, 38, 0.85);
  --surface-border: rgba(255, 255, 255, 0.12);
  --surface-highlight: rgba(255, 255, 255, 0.18);
  --surface-separator: rgba(255, 255, 255, 0.08);

  --apple-blue: #0A84FF;
  --apple-blue-rgb: 10, 132, 255;
  --apple-cyan: #64D2FF;
  --apple-green: #30D158;
  --apple-yellow: #FFD60A;
  --apple-orange: #FF9F0A;
  --apple-red: #FF453A;
  --apple-purple: #BF5AF2;
  --apple-indigo: #5E5CE6;
  
  --vendor-gemini: #4285F4;
  --vendor-openai: #10A37F;
  --vendor-claude: #D97706;
  --vendor-grok: #EA580C;

  --text-primary: #FFFFFF;
  --text-secondary: rgba(235, 235, 245, 0.6);
  --text-tertiary: rgba(235, 235, 245, 0.38);
  --text-quaternary: rgba(235, 235, 245, 0.2);

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-pill: 9999px;

  --spring-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --sidebar-w: 280px;
  --header-h: 56px;
  --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", Monaco, Menlo, Consolas, "Cascadia Code", monospace;
  
  --shadow-window: 0 40px 100px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--surface-border);
  --shadow-popup: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--system-bg);
  font-family: var(--font-stack);
  color: var(--text-primary);
  user-select: none;
}

.ambient-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(1000px 600px at 10% 10%, rgba(var(--apple-blue-rgb), 0.15), transparent 70%),
    radial-gradient(900px 500px at 90% 20%, rgba(191, 90, 242, 0.12), transparent 60%),
    radial-gradient(800px 800px at 50% 90%, rgba(48, 209, 88, 0.08), transparent 70%),
    linear-gradient(180deg, #090A0F 0%, #030407 100%);
}

.ambient-canvas::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
  background-size: 24px 24px;
}

#app {
  position: relative;
  z-index: 1;
  width: 100vw;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  height: 100%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--surface-separator);
  background: rgba(20, 20, 22, 0.6);
  backdrop-filter: blur(35px);
  flex-shrink: 0;
  z-index: 10;
}

.sidebar-header {
  height: var(--header-h);
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--surface-separator);
}

.window-traffic-lights {
  display: flex;
  gap: 8px;
}

.traffic-light {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
}
.traffic-close { background: #FF5F56; border: 0.5px solid #E0443E; }
.traffic-min { background: #FFBD2E; border: 0.5px solid #DEA123; }
.traffic-max { background: #27C93F; border: 0.5px solid #1AAB29; }

.sidebar-nav {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
}

.nav-item.active {
  background: rgba(var(--apple-blue-rgb), 0.18);
  color: var(--apple-blue);
  box-shadow: inset 0 0 0 1px rgba(var(--apple-blue-rgb), 0.3);
}

.session-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  margin-top: 10px;
  padding: 0 12px 12px;
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  text-transform: uppercase;
  padding: 6px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.session-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.session-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.session-row:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-primary);
}

.session-row.active {
  background: rgba(255, 255, 255, 0.09);
  color: var(--text-primary);
  font-weight: 500;
}

.session-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-delete-btn {
  opacity: 0;
  color: var(--text-tertiary);
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 2px 4px;
}
.session-row:hover .session-delete-btn { opacity: 1; }
.session-delete-btn:hover { color: var(--apple-red); }

/* Main Stage */
.main-stage {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  background: rgba(14, 14, 16, 0.4);
}

.stage-header {
  height: var(--header-h);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--surface-separator);
  z-index: 5;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-title {
  font-size: 16px;
  font-weight: 600;
}

/* 4廠模型選擇膠囊 */
.header-picker-group {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--surface-border);
  padding: 3px 10px;
  border-radius: var(--radius-pill);
}

.header-picker-group select {
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  outline: none;
  cursor: pointer;
}

.header-picker-group select option {
  background: #1C1C1E;
  color: #FFF;
}

.vendor-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: var(--radius-pill);
  text-transform: uppercase;
}
.vendor-gemini { background: rgba(66, 133, 244, 0.2); color: var(--vendor-gemini); }
.vendor-openai { background: rgba(16, 163, 127, 0.2); color: var(--vendor-openai); }
.vendor-claude { background: rgba(217, 119, 6, 0.2); color: var(--vendor-claude); }
.vendor-grok { background: rgba(234, 88, 12, 0.2); color: var(--vendor-grok); }

.status-capsule {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--surface-border);
  font-size: 11.5px;
  color: var(--text-secondary);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--apple-green);
  box-shadow: 0 0 8px var(--apple-green);
}

.status-dot.idle { background: var(--apple-green); box-shadow: 0 0 8px var(--apple-green); }
.status-dot.busy { background: var(--apple-yellow); box-shadow: 0 0 8px var(--apple-yellow); animation: pulse 1s infinite; }
.status-dot.error { background: var(--apple-red); box-shadow: 0 0 8px var(--apple-red); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--surface-border);
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.15s var(--spring-smooth);
}

.btn:hover {
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.25);
}

.btn-primary {
  background: var(--apple-blue);
  border-color: rgba(255, 255, 255, 0.3);
  color: #FFFFFF;
}

.btn-primary:hover {
  background: #2591FF;
}

.btn-danger {
  background: rgba(255, 69, 58, 0.15);
  border-color: rgba(255, 69, 58, 0.3);
  color: var(--apple-red);
}

.btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: var(--radius-sm);
}

.view-viewport {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.view-panel {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  overflow-y: auto;
}

.view-panel.active {
  display: flex;
}

/* Chat Layout */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.messages-scrollable {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.chat-bubble-wrap {
  display: flex;
  flex-direction: column;
  max-width: 82%;
  animation: bubblePop 0.25s var(--spring-smooth) forwards;
}

.chat-bubble-wrap.user {
  align-self: flex-end;
  align-items: flex-end;
}

.chat-bubble-wrap.model {
  align-self: flex-start;
  align-items: flex-start;
}

.chat-bubble-meta {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 4px;
}

.chat-bubble {
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  line-height: 1.6;
  position: relative;
  word-break: break-word;
  user-select: text;
}

.chat-bubble-wrap.user .chat-bubble {
  background: var(--apple-blue);
  color: #FFFFFF;
  border-bottom-right-radius: var(--radius-xs);
}

.chat-bubble-wrap.model .chat-bubble {
  background: var(--surface-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--surface-border);
  color: var(--text-primary);
  border-bottom-left-radius: var(--radius-xs);
}

.chat-dock {
  padding: 16px 24px 20px;
  background: linear-gradient(180deg, transparent 0%, rgba(10, 10, 12, 0.9) 100%);
}

.chat-input-wrapper {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl);
  padding: 8px 12px 8px 18px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  box-shadow: var(--shadow-popup);
}

.chat-textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.4;
  resize: none;
  max-height: 160px;
  min-height: 24px;
  padding: 4px 0;
}

/* Pipeline UI */
.pipeline-view {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.pipeline-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-card);
  padding: 18px 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--surface-border);
}

.pipeline-stages-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.pipeline-node {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.pipeline-node.running {
  border-color: var(--apple-blue);
  box-shadow: 0 0 20px rgba(var(--apple-blue-rgb), 0.25);
}

.pipeline-node.done {
  border-color: var(--apple-green);
}

.pipeline-node-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.node-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
}

.node-idx {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}

.pipeline-node-body {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 14px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.input-text, .input-select, .input-textarea {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

.input-select option {
  background: #1C1C1E;
  color: #FFF;
}

.input-textarea {
  font-family: var(--font-mono);
  font-size: 12px;
  resize: vertical;
  min-height: 60px;
}

.node-output-preview {
  background: rgba(0, 0, 0, 0.4);
  border: 1px dashed var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-size: 12px;
  color: var(--text-secondary);
  max-height: 120px;
  overflow-y: auto;
  white-space: pre-wrap;
  font-family: var(--font-mono);
}

.pipeline-connector {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 20px;
  color: var(--text-tertiary);
  font-size: 16px;
}

/* Modal Settings */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(20px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active { display: flex; animation: fadeIn 0.2s ease forwards; }

.modal-sheet {
  width: 100%;
  max-width: 680px;
  max-height: 88vh;
  background: var(--surface-elevated);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-window);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--surface-separator);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-body {
  padding: 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.vendor-config-card {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.vendor-config-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.toast-manager {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background: var(--surface-elevated);
  border: 1px solid var(--surface-border);
  box-shadow: var(--shadow-popup);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  animation: toastIn 0.3s var(--spring-smooth) forwards;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bubblePop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
</style>
</head>
<body>

<div class="ambient-canvas"></div>

<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="window-traffic-lights">
        <span class="traffic-light traffic-close" title="Close"></span>
        <span class="traffic-light traffic-min" title="Minimize"></span>
        <span class="traffic-light traffic-max" title="Maximize"></span>
      </div>
      <button class="btn btn-icon" id="btnNewSession" title="新建對話 (⌘N)">＋</button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-item active" data-view="chatView">
        <span class="icon">💬</span>
        <span>多平台 AI 對話</span>
      </div>
      <div class="nav-item" data-view="pipelineView">
        <span class="icon">⚡️</span>
        <span>多廠商工作流水線</span>
      </div>
    </nav>

    <div class="session-section">
      <div class="section-label">
        <span>對話列表</span>
        <span id="sessionCount">0</span>
      </div>
      <div class="session-list" id="sessionList"></div>
    </div>

    <div style="padding: 12px; border-top: 1px solid var(--surface-separator);">
      <button class="btn" style="width: 100%; justify-content: flex-start;" id="btnOpenSettings">
        <span class="icon">⚙️</span>
        <span>4 廠 API 設定 & 模型</span>
      </button>
    </div>
  </aside>

  <!-- MAIN STAGE -->
  <main class="main-stage">
    <header class="stage-header">
      <div class="header-meta">
        <span class="header-title" id="stageTitle">多平台 AI 對話</span>
        
        <!-- 頂欄 4 廠模型快速切換 -->
        <div class="header-picker-group">
          <select id="chatVendorSelect">
            <option value="gemini">Google Gemini</option>
            <option value="openai">OpenAI (ChatGPT)</option>
            <option value="claude">Anthropic (Claude)</option>
            <option value="grok">xAI (Grok)</option>
          </select>
          <span style="color: var(--text-tertiary);">/</span>
          <select id="chatModelSelect"></select>
        </div>

        <div class="status-capsule">
          <span class="status-dot idle" id="globalStatusDot"></span>
          <span id="globalStatusText">就緒</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" id="btnExportSession" title="匯出對話">📤 匯出</button>
        <button class="btn btn-danger" id="btnClearCurrentChat" title="清空對話">清空</button>
      </div>
    </header>

    <!-- VIEWPORT -->
    <div class="view-viewport">
      <!-- 1. CHAT VIEW -->
      <section class="view-panel active" id="chatView">
        <div class="chat-container">
          <div class="messages-scrollable" id="messagesContainer"></div>
          <div class="chat-dock">
            <div class="chat-input-wrapper">
              <textarea class="chat-textarea" id="chatInput" placeholder="輸入訊息至當前選定的 AI 模型 (Shift+Enter 換行)..." rows="1"></textarea>
              <button class="btn btn-primary" id="btnSendMessage">發送</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 2. PIPELINE VIEW -->
      <section class="view-panel" id="pipelineView">
        <div class="pipeline-view">
          <div class="pipeline-hero">
            <div>
              <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">多廠商 AI 串行工作流水線</h2>
              <p style="font-size: 12.5px; color: var(--text-secondary);">自由組合 Gemini、Claude、GPT 與 Grok，自動流轉多階段推論。</p>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn" id="btnAddPipelineStage">＋ 新增步驟</button>
              <button class="btn btn-primary" id="btnRunPipeline">🚀 執行流水線</button>
            </div>
          </div>

          <div class="field-group" style="background: var(--surface-card); padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--surface-border);">

<script>
'use strict';

// 預設模型清單
const DEFAULT_MODELS = {

  openai: ['gpt-4o', 'gpt-4o-mini', 'gpt-4.5-preview', 'o3-mini'],
  claude: ['claude-3-7-sonnet-20250219', 'claude-3-5-sonnet-20241022', 'claude-3-5-haiku-20241022'],

};

const Store = {
  activeSessionId: null,
  sessions: [],
  keys: { gemini: '', openai: '', claude: '', grok: '' },
  modelsRegistry: JSON.parse(JSON.stringify(DEFAULT_MODELS)),
  chatSelection: { vendor: 'gemini', model: 'gemini-2.5-flash' },
  pipelineStages: [
    {
      id: 'stg_1',
      title: '第一階段：Gemini 題意識別與考點解析',
      vendor: 'gemini',
      model: 'gemini-2.5-flash',
      systemPrompt: '請詳細識別問題類型、關鍵已知條件及解題方向。',
      temperature: 0.2,
      lastOutput: ''
    },
    {
      id: 'stg_2',
      title: '第二階段：Claude 邏輯推演與二次複核',
      vendor: 'claude',
      model: 'claude-3-7-sonnet-20250219',
      systemPrompt: '請以獨立視角檢查前置步驟，指出潛在的計算或邏輯漏洞並給出完整步驟。',
      temperature: 0.2,
      lastOutput: ''
    },
    {
      id: 'stg_3',
      title: '第三階段：OpenAI 交叉總結與最終決策',
      vendor: 'openai',
      model: 'gpt-4o',
      systemPrompt: '請融合所有分析，給出標準答案及最終推薦路徑。',
      temperature: 0.1,

    }
  ]
};

// 本地存儲
function saveStore() {
  localStorage.setItem('UNIVERSAL_AI_STORE_V1', JSON.stringify({
    sessions: Store.sessions,
    activeSessionId: Store.activeSessionId,
    keys: Store.keys,
    modelsRegistry: Store.modelsRegistry,
    chatSelection: Store.chatSelection,
    pipelineStages: Store.pipelineStages
  }));
}

function loadStore() {
  try {
    const raw = localStorage.getItem('UNIVERSAL_AI_STORE_V1');
    if (raw) {
      const parsed = JSON.parse(raw);
      Store.sessions = parsed.sessions || [];
      Store.activeSessionId = parsed.activeSessionId || null;
      Store.keys = parsed.keys || Store.keys;
      Store.modelsRegistry = parsed.modelsRegistry || Store.modelsRegistry;
      Store.chatSelection = parsed.chatSelection || Store.chatSelection;
      Store.pipelineStages = parsed.pipelineStages || Store.pipelineStages;
    }
  } catch (err) {
    console.error(err);
  }

  if (Store.sessions.length === 0) {
    createNewSession('新對話');
  } else if (!Store.activeSessionId || !Store.sessions.find(s => s.id === Store.activeSessionId)) {
    Store.activeSessionId = Store.sessions[0].id;
  }
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
  toast.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ==========================================================================
// 4 廠 API 核心請求調用引擎
// ==========================================================================
async function callVendorAPI({ vendor, model, prompt, messages = [], system = '', temperature = 0.7 }) {
  const key = (Store.keys[vendor] || '').trim();
  if (!key) throw new Error(`未配置 ${vendor.toUpperCase()} 的 API Key，請至設定中填寫。`);

  // 1. Google Gemini
  if (vendor === 'gemini') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
    const contents = messages.length > 0 
      ? messages.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] }))
      : [{ role: 'user', parts: [{ text: prompt }] }];
    
    const body = {
      contents,
      generationConfig: { temperature: parseFloat(temperature), maxOutputTokens: 8192 }
    };
    if (system) body.systemInstruction = { parts: [{ text: system }] };

    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(`Gemini HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    return data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
  }

  // 2. OpenAI (ChatGPT)
  if (vendor === 'openai') {
    const url = 'https://api.openai.com/v1/chat/completions';
    const reqMsgs = [];
    if (system) reqMsgs.push({ role: 'system', content: system });
    if (messages.length > 0) {
      messages.forEach(m => reqMsgs.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
    } else {
      reqMsgs.push({ role: 'user', content: prompt });
    }

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${key}` },
      body: JSON.stringify({ model, messages: reqMsgs, temperature: parseFloat(temperature) })
    });
    if (!res.ok) throw new Error(`OpenAI HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    return data?.choices?.[0]?.message?.content || '';
  }

  // 3. Anthropic (Claude)
  if (vendor === 'claude') {
    const url = 'https://api.anthropic.com/v1/messages';
    const reqMsgs = messages.length > 0
      ? messages.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }))
      : [{ role: 'user', content: prompt }];

    const body = {
      model,
      max_tokens: 4096,
      messages: reqMsgs,
      temperature: parseFloat(temperature)
    };
    if (system) body.system = system;

    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'dangerously-allow-browser': 'true'
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`Claude HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    return data?.content?.filter(b => b.type === 'text').map(b => b.text).join('') || '';
  }

  // 4. xAI (Grok)
  if (vendor === 'grok') {
    const url = 'https://api.x.ai/v1/chat/completions';
    const reqMsgs = [];
    if (system) reqMsgs.push({ role: 'system', content: system });
    if (messages.length > 0) {
      messages.forEach(m => reqMsgs.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
    } else {
      reqMsgs.push({ role: 'user', content: prompt });
    }

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${key}` },
      body: JSON.stringify({ model, messages: reqMsgs, temperature: parseFloat(temperature) })
    });
    if (!res.ok) throw new Error(`Grok HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    return data?.choices?.[0]?.message?.content || '';
  }

  throw new Error(`未知廠商: ${vendor}`);
}

// 動態拉取遠端模型清單
async function fetchRemoteModels(vendor) {
  const key = (Store.keys[vendor] || '').trim();
  if (!key) return showToast(`請先輸入 ${vendor.toUpperCase()} 的 API Key`, 'warn');
  showToast(`正在拉取 ${vendor.toUpperCase()} 模型清單...`, 'info');

  try {
    let models = [];
    if (vendor === 'gemini') {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      models = (data.models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map(m => m.name.replace(/^models\//, ''));
    } else if (vendor === 'openai') {
      const res = await fetch('https://api.openai.com/v1/models', { headers: { Authorization: `Bearer ${key}` } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      models = (data.data || []).map(m => m.id).filter(id => /^(gpt-|o1|o3|o4|chatgpt-)/i.test(id));
    } else if (vendor === 'claude') {
      const res = await fetch('https://api.anthropic.com/v1/models', {
        headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'dangerously-allow-browser': 'true' }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      models = (data.data || []).map(m => m.id);
    } else if (vendor === 'grok') {
      const res = await fetch('https://api.x.ai/v1/models', { headers: { Authorization: `Bearer ${key}` } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      models = (data.data || []).map(m => m.id);
    }

    if (models.length > 0) {
      Store.modelsRegistry[vendor] = models;
      saveStore();
      updateChatModelPicker();
      renderPipelineStages();
      showToast(`成功同步 ${models.length} 個 ${vendor.toUpperCase()} 模型！`, 'success');
    } else {
      showToast('未獲取到有效模型', 'warn');
    }
  } catch (err) {
    showToast(`獲取失敗: ${err.message}`, 'error');
  }
}

// 對話與 UI 渲染
// ==========================================================================
function updateChatModelPicker() {
  const vendorSelect = document.getElementById('chatVendorSelect');
  const modelSelect = document.getElementById('chatModelSelect');
  vendorSelect.value = Store.chatSelection.vendor;

  const models = Store.modelsRegistry[Store.chatSelection.vendor] || [];
  modelSelect.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');

  if (!models.includes(Store.chatSelection.model)) {
    Store.chatSelection.model = models[0] || '';
  }
  modelSelect.value = Store.chatSelection.model;
}

function createNewSession(title = '新對話') {
  const newSession = {
    id: 'ses_' + Date.now(),
    title,
    messages: [
      {
        role: 'model',
        vendor: 'gemini',
        model: 'gemini-2.5-flash',
        text: '您好！已連接四大廠商 (Gemini, ChatGPT, Claude, Grok) 引擎，請在頂部隨意切換模型開始對話。',
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
    ]
  };
  Store.sessions.unshift(newSession);
  Store.activeSessionId = newSession.id;
  saveStore();
  renderSessionList();
  renderActiveChat();
}

function getActiveSession() {
  return Store.sessions.find(s => s.id === Store.activeSessionId);
}

function renderSessionList() {
  const container = document.getElementById('sessionList');
  container.innerHTML = '';
  document.getElementById('sessionCount').textContent = Store.sessions.length;

  Store.sessions.forEach(session => {
    const row = document.createElement('div');
    row.className = `session-row ${session.id === Store.activeSessionId ? 'active' : ''}`;
    row.onclick = () => {
      Store.activeSessionId = session.id;
      saveStore();
      renderSessionList();
      renderActiveChat();
    };

    row.innerHTML = `
      <div class="session-title-wrap">
        <span>💬</span>
        <span>${session.title}</span>
      </div>
      <button class="session-delete-btn" title="刪除">✕</button>
    `;
    row.querySelector('.session-delete-btn').onclick = (e) => {
      e.stopPropagation();
      if (Store.sessions.length <= 1) return showToast('至少需保留一個對話', 'warn');
      Store.sessions = Store.sessions.filter(s => s.id !== session.id);
      if (Store.activeSessionId === session.id) Store.activeSessionId = Store.sessions[0].id;
      saveStore();
      renderSessionList();
      renderActiveChat();
    };
    container.appendChild(row);
  });
}

function renderActiveChat() {
  const session = getActiveSession();
  const container = document.getElementById('messagesContainer');
  container.innerHTML = '';
  if (!session) return;

  session.messages.forEach(msg => {
    const wrap = document.createElement('div');
    wrap.className = `chat-bubble-wrap ${msg.role}`;
    
    wrap.innerHTML = `
      <div class="chat-bubble-meta">
        <span>${msg.role === 'user' ? '您' : (msg.vendor ? msg.vendor.toUpperCase() : 'AI')}</span>
        ${msg.model ? `<span class="vendor-badge vendor-${msg.vendor || 'gemini'}">${msg.model}</span>` : ''}
        <span>•</span>
        <span>${msg.timestamp || ''}</span>
      </div>
      <div class="chat-bubble">${formatMarkdownToHtml(msg.text)}</div>
    `;
    container.appendChild(wrap);
  });
  container.scrollTop = container.scrollHeight;
}

function formatMarkdownToHtml(text) {
  if (!text) return '';
  let esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  esc = esc.replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  esc = esc.replace(/`([^`]+)`/g, '<code>$1</code>');
  esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return esc.replace(/\n/g, '<br>');
}

async function handleSendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  const session = getActiveSession();
  if (!session) return;

  session.messages.push({
    role: 'user',
    text,
    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });

  if (session.messages.length === 2) {
    session.title = text.slice(0, 18) + (text.length > 18 ? '...' : '');
    renderSessionList();
  }

  input.value = '';
  renderActiveChat();

  const currentVendor = Store.chatSelection.vendor;
  const currentModel = Store.chatSelection.model;

  setGlobalStatus('busy', `${currentVendor.toUpperCase()} (${currentModel}) 正在生成...`);

  try {
    const reply = await callVendorAPI({
      vendor: currentVendor,
      model: currentModel,
      messages: session.messages
    });

    session.messages.push({
      role: 'model',
      vendor: currentVendor,
      model: currentModel,
      text: reply,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });

    saveStore();
    renderActiveChat();
    setGlobalStatus('idle', '就緒');
  } catch (err) {
    setGlobalStatus('error', '請求失敗');
    showToast(err.message, 'error');
    session.messages.push({
      role: 'model',
      vendor: currentVendor,
      model: currentModel,
      text: `⚠️ **調用失敗:** ${err.message}`,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });
    renderActiveChat();
  }
}

// ==========================================================================
// 多廠商流水線 Orchestrator
// ==========================================================================
function renderPipelineStages() {
  const container = document.getElementById('pipelineStagesList');
  container.innerHTML = '';

  Store.pipelineStages.forEach((stage, idx) => {
    if (idx > 0) {
      const conn = document.createElement('div');
      conn.className = 'pipeline-connector';
      conn.textContent = '↓';
      container.appendChild(conn);
    }

    const node = document.createElement('div');
    node.className = 'pipeline-node';
    node.id = `node_${stage.id}`;

    const vendorModels = Store.modelsRegistry[stage.vendor] || [];

    node.innerHTML = `
      <div class="pipeline-node-header">
        <div class="node-badge">
          <span class="node-idx">${idx + 1}</span>
          <span>${stage.title}</span>
        </div>
        <button class="btn btn-danger btn-icon" onclick="deletePipelineStage(${idx})">✕</button>
      </div>
      <div class="pipeline-node-body">
        <div class="field-group">
          <label class="field-label">執行廠商 & 模型</label>
          <select class="input-select" onchange="updateStageVendor(${idx}, this.value)">
            <option value="gemini" ${stage.vendor === 'gemini' ? 'selected' : ''}>Google Gemini</option>
            <option value="openai" ${stage.vendor === 'openai' ? 'selected' : ''}>OpenAI (ChatGPT)</option>
            <option value="claude" ${stage.vendor === 'claude' ? 'selected' : ''}>Anthropic (Claude)</option>
            <option value="grok" ${stage.vendor === 'grok' ? 'selected' : ''}>xAI (Grok)</option>
          </select>

          <select class="input-select" style="margin-top: 6px;" onchange="updateStageModel(${idx}, this.value)">
            ${vendorModels.map(m => `<option value="${m}" ${m === stage.model ? 'selected' : ''}>${m}</option>`).join('')}
          </select>

          <label class="field-label" style="margin-top: 6px;">溫度 (Temperature)</label>
          <input type="number" step="0.1" min="0" max="1" class="input-text" value="${stage.temperature}" onchange="updateStageTemp(${idx}, this.value)">
        </div>

        <div class="field-group">
          <label class="field-label">系統指令 (System Instruction)</label>
          <textarea class="input-textarea" onchange="updateStagePrompt(${idx}, this.value)">${stage.systemPrompt}</textarea>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">節點輸出結果</label>
        <div class="node-output-preview">${stage.lastOutput || '尚未執行該節點。'}</div>
      </div>
    `;
    container.appendChild(node);
  });
}

function updateStageVendor(idx, v) {
  Store.pipelineStages[idx].vendor = v;
  Store.pipelineStages[idx].model = (Store.modelsRegistry[v] || [])[0] || '';
  saveStore();
  renderPipelineStages();
}
function updateStageModel(idx, m) { Store.pipelineStages[idx].model = m; saveStore(); }
function updateStageTemp(idx, t) { Store.pipelineStages[idx].temperature = parseFloat(t); saveStore(); }
function updateStagePrompt(idx, p) { Store.pipelineStages[idx].systemPrompt = p; saveStore(); }

function deletePipelineStage(idx) {
  if (Store.pipelineStages.length <= 1) return showToast('至少需保留一個步驟', 'warn');
  Store.pipelineStages.splice(idx, 1);
  saveStore();
  renderPipelineStages();
}

async function executePipeline() {
  const rootInput = document.getElementById('pipelineInitialPayload').value.trim();
  if (!rootInput) return showToast('請提供流水線初始輸入數據', 'warn');

  setGlobalStatus('busy', '流水線執行中...');
  let rollingPayload = rootInput;

  for (let i = 0; i < Store.pipelineStages.length; i++) {
    const stage = Store.pipelineStages[i];
    const nodeElem = document.getElementById(`node_${stage.id}`);
    if (nodeElem) nodeElem.classList.add('running');

    try {
      const output = await callVendorAPI({
        vendor: stage.vendor,
        model: stage.model,
        prompt: `【前置步驟輸出數據】：\n\n${rollingPayload}`,
        system: stage.systemPrompt,
        temperature: stage.temperature
      });

      stage.lastOutput = output;
      rollingPayload = output;

      if (nodeElem) {
        nodeElem.classList.remove('running');
        nodeElem.classList.add('done');
        nodeElem.querySelector('.node-output-preview').textContent = output;
      }
    } catch (err) {
      if (nodeElem) nodeElem.classList.remove('running');
      setGlobalStatus('error', '流水線中斷');
      return showToast(`步驟 ${i + 1} (${stage.vendor.toUpperCase()}) 失敗: ${err.message}`, 'error');
    }
  }

  saveStore();
  setGlobalStatus('idle', '流水線完成');
  showToast('流水線全部節點處理完成！', 'success');
}

function setGlobalStatus(state, label) {
  document.getElementById('globalStatusDot').className = `status-dot ${state}`;
  document.getElementById('globalStatusText').textContent = label;
}

  loadStore();
  updateChatModelPicker();
  renderSessionList();
  renderActiveChat();
  renderPipelineStages();

  // 頂欄下拉選單聯動
  document.getElementById('chatVendorSelect').onchange = (e) => {
    Store.chatSelection.vendor = e.target.value;
    updateChatModelPicker();
    saveStore();
  };
  document.getElementById('chatModelSelect').onchange = (e) => {
    Store.chatSelection.model = e.target.value;
    saveStore();
  };

  // 導航切換
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      item.classList.add('active');
      const viewId = item.dataset.view;
      document.getElementById(viewId).classList.add('active');
      document.getElementById('stageTitle').textContent = viewId === 'chatView' ? '多平台 AI 對話' : '多廠商工作流水線';
    });
  });

  // 設定 Modal
  document.getElementById('btnOpenSettings').onclick = () => {
    document.getElementById('key_gemini').value = Store.keys.gemini || '';
    document.getElementById('key_openai').value = Store.keys.openai || '';
    document.getElementById('key_claude').value = Store.keys.claude || '';
    document.getElementById('key_grok').value = Store.keys.grok || '';
    document.getElementById('settingsModal').classList.add('active');
  };
  document.getElementById('btnCloseSettings').onclick = () => document.getElementById('settingsModal').classList.remove('active');

  document.getElementById('btnSaveKeys').onclick = () => {
    Store.keys.gemini = document.getElementById('key_gemini').value.trim();
    Store.keys.openai = document.getElementById('key_openai').value.trim();
    Store.keys.claude = document.getElementById('key_claude').value.trim();
    Store.keys.grok = document.getElementById('key_grok').value.trim();
    saveStore();
    document.getElementById('settingsModal').classList.remove('active');
    showToast('4 廠 API 設定已全部保存！', 'success');
  };

  // 對話操作
  document.getElementById('btnNewSession').onclick = () => createNewSession();
  document.getElementById('btnExportSession').onclick = () => {
    const session = getActiveSession();
    if (!session) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(session, null, 2)], { type: 'application/json' }));
    a.download = `Universal_Chat_${session.title}.json`;
    a.click();
  };
  document.getElementById('btnClearCurrentChat').onclick = () => {
    const session = getActiveSession();
    if (session) {
      session.messages = [];
      saveStore();
      renderActiveChat();
      showToast('對話內容已清空', 'info');
    }
  };

  // 流水線操作
  document.getElementById('btnAddPipelineStage').onclick = () => {
    Store.pipelineStages.push({
      id: 'stg_' + Date.now(),
      title: `階段 ${Store.pipelineStages.length + 1}：新增任務節點`,
      vendor: 'gemini',
      model: 'gemini-2.5-flash',
      systemPrompt: '請對前置內容進行提煉與改進。',
      temperature: 0.3,
      lastOutput: ''
    });
    saveStore();
    renderPipelineStages();
  };
  document.getElementById('btnRunPipeline').onclick = executePipeline;

  // 輸入框
  const chatInput = document.getElementById('chatInput');
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSendMessage();
    }
  });
  document.getElementById('btnSendMessage').onclick = handleSendMessage;
});
</script>
</body>
</html>

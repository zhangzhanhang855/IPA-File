name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App with Xcode (arm64 Device)
        run: |
          xcodebuild clean build \
            -project StockScope.xcodeproj \
            -scheme StockScope \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos

      - name: Verify Executable & Package IPA
        run: |
          APP_PATH="./build/Release-iphoneos/StockScope.app"
          
          # 检查编译产物中是否存在可执行文件
          if [ ! -f "$APP_PATH/StockScope" ]; then
            echo "ERROR: StockScope binary executable not found in $APP_PATH!"
            ls -la "$APP_PATH"
            exit 1
          fi
          
          # 检查架构是否包含 arm64
          lipo -info "$APP_PATH/StockScope"
          
          # 清理旧目录并创建 Payload
          rm -rf Payload StockScope-unsigned.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # 确保 HTML 被放入 App 根目录
          if [ -f "StockScope/index.html" ]; then
            cp "StockScope/index.html" "Payload/StockScope.app/"
          fi
          
          # 严格以标准 IPA 结构压缩
          zip -qr StockScope-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockScope-unsigned-ipa
          path: StockScope-unsigned.ipa
          retention-days: 7

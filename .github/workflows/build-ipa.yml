name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Libbox Prebuilt Core
        run: |
          echo ">>> 正在查询 sing-box 最新 release 资源列表 ..."
          
          # 通过 GitHub API 动态匹配包含 libbox 且适用于 darwin 或 ios 的压缩包链接
          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest | \
            grep -Eo '"browser_download_url": *"[^"]*libbox[^"]*(darwin|ios)[^"]*\.(tar\.xz|zip)"' | \
            head -n 1 | cut -d '"' -f 4)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo ">>> 未在 latest 中匹配到，尝试搜索全部 releases ..."
            DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases | \
              grep -Eo '"browser_download_url": *"[^"]*libbox[^"]*\.(tar\.xz|zip)"' | \
              head -n 1 | cut -d '"' -f 4)
          fi

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: 找不到可用的 Libbox 下载资源，请检查 Releases 列表！"
            exit 1
          fi

          echo ">>> 实际下载链接: $DOWNLOAD_URL"
          
          # -f 确保遇到 404 等 HTTP 错误时立即报错中断，不下载错误文本
          if [[ "$DOWNLOAD_URL" == *.zip ]]; then
            curl -fL -o libbox.zip "$DOWNLOAD_URL"
            unzip -q libbox.zip
          else
            curl -fL -o libbox.tar.xz "$DOWNLOAD_URL"
            tar -xf libbox.tar.xz
          fi

          # 确保解压出来的 Libbox.xcframework 位于项目根目录下
          if [ ! -d "Libbox.xcframework" ]; then
            FOUND_PATH=$(find . -maxdepth 3 -name "Libbox.xcframework" -type d | head -n 1)
            if [ -n "$FOUND_PATH" ]; then
              mv "$FOUND_PATH" ./Libbox.xcframework
            else
              echo "ERROR: 未能找到 Libbox.xcframework，请检查解压产物！"
              ls -la
              exit 1
            fi
          fi

          echo ">>> Libbox.xcframework 准备完成！"
          ls -ld Libbox.xcframework

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App with Xcode (arm64 Device)
        run: |
          # 采用 Ad-Hoc 伪签名 ("-")，保证主 App 与 Extension 均能完成构建并正确嵌入
          xcodebuild clean build \
            -project StockScope.xcodeproj \
            -scheme StockScope \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos

      - name: Verify Executable & Package IPA
        run: |
          APP_PATH="./build/Release-iphoneos/StockScope.app"
          
          # 检查主 App 可执行文件
          if [ ! -f "$APP_PATH/StockScope" ]; then
            echo "ERROR: StockScope binary executable not found in $APP_PATH!"
            ls -la "$APP_PATH"
            exit 1
          fi
          
          # 检查网络扩展插件目录
          if [ ! -d "$APP_PATH/PlugIns" ]; then
            echo "ERROR: PlugIns directory not found! PacketTunnel was not embedded."
            ls -la "$APP_PATH"
            exit 1
          fi
          
          echo ">>> 验证 PlugIns 内容："
          ls -la "$APP_PATH/PlugIns"
          
          # 检查架构是否包含 arm64
          lipo -info "$APP_PATH/StockScope"
          
          # 清理旧目录并创建 Payload
          rm -rf Payload StockScope-unsigned.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # 确保 HTML 被放入 App 根目录
          if [ -f "StockScope/index.html" ]; then
            cp "StockScope/index.html" "Payload/StockScope.app/"
          fi
          
          # 严格以标准 IPA 结构压缩
          zip -qr StockScope-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockScope-unsigned-ipa
          path: StockScope-unsigned.ipa
          retention-days: 7

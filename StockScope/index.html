<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StockScope AnyTLS</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #161822;
      --border: #232738;
      --text: #f1f5f9;
      --muted: #64748b;
      --primary: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 24px) + 20px) 20px calc(env(safe-area-inset-bottom, 24px) + 20px);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      background: #1e2433;
      border: 1px solid var(--border);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-connected .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .status-connecting .dot { background: var(--yellow); }
    .status-disconnected .dot { background: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-top: 30px;
    }
    .node-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .node-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      word-break: break-all;
    }
    .btn-toggle {
      width: 100%;
      height: 60px;
      border-radius: 18px;
      border: none;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }
    .btn-toggle:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-toggle.connected {
      background: var(--red);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
    }
  </style>
</head>
<body>
  <div>
    <div class="header">
      <div class="title">AnyTLS VPN</div>
      <div id="statusBadge" class="badge status-disconnected">
        <span class="dot"></span>
        <span id="statusText">未连接</span>
      </div>
    </div>

    <div class="card">
      <div class="node-title">🇸🇬 Singapore丨03</div>
      <div class="node-desc">
        节点: 8afkpepd7.yn33dfs2.sbs:643<br>
        SNI: down-30005.sz.gfp.tencent-cloud.com<br>
        类型: AnyTLS / uTLS Chrome
      </div>
    </div>
  </div>

  <button id="toggleBtn" class="btn-toggle" onclick="toggleProxy()">启动连接</button>

  <script>
    let currentStatus = "disconnected";

    // 内嵌 AnyTLS 节点的标准 sing-box 配置
    function getEmbeddedConfig() {
      return {
        "log": {
          "level": "warn"
        },
        "dns": {
          "servers": [
            { "tag": "dns-remote", "address": "1.1.1.1", "detour": "proxy" }
          ]
        },
        "inbounds": [
          {
            "type": "tun",
            "tag": "tun-in",
            "interface_name": "utun",
            "inet4_address": "172.19.0.1/28",
            "auto_route": false,
            "strict_route": false,
            "sniff": true
          }
        ],
        "outbounds": [
          {
            "type": "anytls",
            "tag": "proxy",
            "server": "8afkpepd7.yn33dfs2.sbs",
            "server_port": 643,
            "password": "cdbde5eb-3df1-4907-a831-c6c3680b9369",
            "tls": {
              "enabled": true,
              "server_name": "down-30005.sz.gfp.tencent-cloud.com",
              "insecure": true,
              "utls": {
                "enabled": true,
                "fingerprint": "chrome"
              }
            }
          },
          { "type": "direct", "tag": "direct" }
        ],
        "route": {
          "rules": [
            { "outbound": "proxy" }
          ],
          "auto_detect_interface": true
        }
      };
    }

    function toggleProxy() {
      if (currentStatus === "connected") {
        window.webkit.messageHandlers.stopProxy.postMessage(null);
      } else {
        const configStr = JSON.stringify(getEmbeddedConfig());
        window.webkit.messageHandlers.startProxy.postMessage(configStr);
      }
    }

    window.onProxyStatusChange = function(status) {
      currentStatus = status;
      const badge = document.getElementById("statusBadge");
      const text = document.getElementById("statusText");
      const btn = document.getElementById("toggleBtn");

      badge.className = `badge status-${status}`;
      if (status === "connected") {
        text.innerText = "已连接";
        btn.innerText = "断开连接";
        btn.classList.add("connected");
      } else if (status === "connecting") {
        text.innerText = "正在连接...";
        btn.innerText = "正在连接...";
        btn.classList.remove("connected");
      } else {
        text.innerText = "未连接";
        btn.innerText = "启动连接";
        btn.classList.remove("connected");
      }
    };

    window.onload = function() {
      if (window.webkit && window.webkit.messageHandlers.getProxyStatus) {
        window.webkit.messageHandlers.getProxyStatus.postMessage(null);
      }
    };
  </script>
</body>
</html>

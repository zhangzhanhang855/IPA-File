name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install Tools
        run: |
          brew install xcodegen

      # 直接现场拉取 sing-box 源码并编译 Libbox.xcframework
      - name: Build Libbox.xcframework from Source
        run: |
          mkdir -p Frameworks
          if [ ! -d "Frameworks/Libbox.xcframework" ]; then
            echo ">>> Building Libbox.xcframework using gomobile..."
            go install golang.org/x/mobile/cmd/gomobile@latest
            go install golang.org/x/mobile/cmd/gobind@latest
            gomobile init

            git clone --depth=1 https://github.com/SagerNet/sing-box.git /tmp/sing-box
            cd /tmp/sing-box

            # 编译适配 iOS 的 XCFramework
            gomobile bind -v \
              -target=ios \
              -tags "with_quic with_dhcp with_wireguard with_ech" \
              -o Libbox.xcframework \
              ./experimental/libbox

            mv Libbox.xcframework "$GITHUB_WORKSPACE/Frameworks/"
            cd "$GITHUB_WORKSPACE"
          fi

          if [ ! -d "Frameworks/Libbox.xcframework" ]; then
            echo "ERROR: Libbox.xcframework compilation failed!"
            exit 1
          fi
          echo ">>> Libbox.xcframework ready."

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Targets
        run: |
          # 1. 编译 PacketTunnel Network Extension Target
          xcodebuild clean build \
            -project StockScope.xcodeproj \
            -target PacketTunnel \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos

          # 2. 编译主 App Target
          xcodebuild build \
            -project StockScope.xcodeproj \
            -scheme StockScope \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos

      - name: Verify & Package IPA
        run: |
          APP_PATH="./build/Release-iphoneos/StockScope.app"
          EXT_PATH="./build/Release-iphoneos/PacketTunnel.appex"

          if [ ! -f "$APP_PATH/StockScope" ]; then
            echo "ERROR: StockScope executable not found in $APP_PATH!"
            ls -la "$APP_PATH"
            exit 1
          fi

          if [ ! -d "$EXT_PATH" ]; then
            echo "ERROR: PacketTunnel.appex not found in ./build/Release-iphoneos/!"
            exit 1
          fi

          lipo -info "$APP_PATH/StockScope"

          rm -rf Payload StockScope-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 确保将 Network Extension 放入主包的 PlugIns 目录
          mkdir -p "Payload/StockScope.app/PlugIns"
          cp -R "$EXT_PATH" "Payload/StockScope.app/PlugIns/"

          # 确保前端 index.html 存在于 App 根目录
          if [ -f "StockScope/index.html" ]; then
            cp "StockScope/index.html" "Payload/StockScope.app/"
          fi

          # 压缩为标准 IPA 结构
          zip -qry StockScope-unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockScope-unsigned-ipa
          path: StockScope-unsigned.ipa
          retention-days: 14

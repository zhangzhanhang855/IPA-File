<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StockScope AnyTLS</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #141721;
      --border: #232738;
      --text: #f1f5f9;
      --muted: #64748b;
      --primary: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 24px) + 16px) 16px calc(env(safe-area-inset-bottom, 24px) + 16px);
      gap: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      background: #1e2433;
      border: 1px solid var(--border);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-connected .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-connecting .dot { background: var(--yellow); }
    .status-disconnected .dot { background: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .node-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .node-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .btn-toggle {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: all 0.2s;
    }
    .btn-toggle:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-toggle.connected {
      background: var(--red);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
    }
    
    /* 实时日志终端 */
    .terminal {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      min-height: 220px;
    }
    .terminal-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      border-bottom: 1px solid #21262d;
      padding-bottom: 4px;
    }
    .terminal-body {
      flex: 1;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.4;
      user-select: text;
    }
    .log-item {
      margin-bottom: 4px;
      word-break: break-all;
    }
    .log-info { color: #8b949e; }
    .log-error { color: #f85149; font-weight: 600; }
    .log-warn { color: #d29922; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">JRvpn</div>
    <div id="statusBadge" class="badge status-disconnected">
      <span class="dot"></span>
      <span id="statusText">未连接</span>
    </div>
  </div>

  <div class="card">
    <div class="node-title">🇸🇬 Singapore丨03</div>
    <div class="node-desc">
      8afkpepd7.yn33dfs2.sbs:643<br>
      SNI: down-30005.sz.gfp.tencent-cloud.com (AnyTLS)
    </div>
  </div>

  <button id="toggleBtn" class="btn-toggle" onclick="toggleProxy()">启动JRvpn For iOS</button>

  <div class="terminal">
    <div class="terminal-header">
      <span>Console Logs</span>
      <span onclick="document.getElementById('logs').innerHTML=''" style="cursor: pointer; color: var(--primary);">清屏</span>
    </div>
    <div id="logs" class="terminal-body"></div>
  </div>

  <script>
    let currentStatus = "disconnected";

    function appendLog(msg, level = "info") {
      const logs = document.getElementById("logs");
      const item = document.createElement("div");
      item.className = `log-item log-${level}`;
      const time = new Date().toTimeString().split(' ')[0];
      item.innerText = `[${time}] ${msg}`;
      logs.appendChild(item);
      logs.scrollTop = logs.scrollHeight;
    }

    function getEmbeddedConfig() {
      return {
        "log": { "level": "warn" },
        "dns": {
          "servers": [
            { "tag": "dns-remote", "address": "1.1.1.1", "detour": "proxy" }
          ]
        },
        "inbounds": [
          {
            "type": "tun",
            "tag": "tun-in",
            "interface_name": "utun",
            "inet4_address": "172.19.0.1/28",
            "auto_route": true,
            "strict_route": false,
            "sniff": true
          }
        ],
        "outbounds": [
          {
            "type": "anytls",
            "tag": "proxy",
            "server": "8afkpepd7.yn33dfs2.sbs",
            "server_port": 643,
            "password": "cdbde5eb-3df1-4907-a831-c6c3680b9369",
            "tls": {
              "enabled": true,
              "server_name": "down-30005.sz.gfp.tencent-cloud.com",
              "insecure": true,
              "utls": { "enabled": true, "fingerprint": "chrome" }
            }
          },
          { "type": "direct", "tag": "direct" }
        ],
        "route": {
          "rules": [{ "outbound": "proxy" }],
          "auto_detect_interface": true
        }
      };
    }

    function toggleProxy() {
      appendLog("按钮被点击，当前状态: " + currentStatus);
      if (!window.webkit || !window.webkit.messageHandlers) {
        appendLog("错误: 未检测到 WKScriptMessageHandler 桥接环境！", "error");
        return;
      }

      if (currentStatus === "connected") {
        appendLog("调用原生 stopProxy...");
        window.webkit.messageHandlers.stopProxy.postMessage(null);
      } else {
        appendLog("生成 AnyTLS JSON 配置并调用 startProxy...");
        try {
          const configStr = JSON.stringify(getEmbeddedConfig());
          window.webkit.messageHandlers.startProxy.postMessage(configStr);
          appendLog("已发送 startProxy 请求，等待原生返回...");
        } catch (e) {
          appendLog("配置序列化失败: " + e.message, "error");
        }
      }
    }

    window.onProxyStatusChange = function(status) {
      currentStatus = status;
      const badge = document.getElementById("statusBadge");
      const text = document.getElementById("statusText");
      const btn = document.getElementById("toggleBtn");

      badge.className = `badge status-${status}`;
      if (status === "connected") {
        text.innerText = "已连接";
        btn.innerText = "断开连接";
        btn.classList.add("connected");
      } else if (status === "connecting") {
        text.innerText = "正在连接...";
        btn.innerText = "正在连接...";
        btn.classList.remove("connected");
      } else {
        text.innerText = "未连接";
        btn.innerText = "启动连接";
        btn.classList.remove("connected");
      }
    };

    window.onload = function() {
      appendLog("Web 前端初始化完毕");
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.getProxyStatus) {
        window.webkit.messageHandlers.getProxyStatus.postMessage(null);
      }
    };
  </script>
</body>
</html>

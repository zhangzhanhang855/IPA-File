name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install Tools
        run: |
          brew install xcodegen

      # 编译 Libbox.xcframework
      - name: Build Libbox.xcframework from Source
        run: |
          mkdir -p Frameworks
          if [ ! -d "Frameworks/Libbox.xcframework" ]; then
            echo ">>> Setting up gomobile tools..."
            go install golang.org/x/mobile/cmd/gomobile@latest
            go install golang.org/x/mobile/cmd/gobind@latest
            gomobile init

            echo ">>> Cloning sing-box source..."
            git clone --depth=1 https://github.com/SagerNet/sing-box.git /tmp/sing-box
            cd /tmp/sing-box

            # 注入 gomobile 依赖到当前 module
            go get golang.org/x/mobile/bind
            go get -tool golang.org/x/mobile/cmd/gobind || true

            echo ">>> Compiling Libbox.xcframework..."
            # 移除已废弃的 with_ech 标签
            gomobile bind -v \
              -target=ios \
              -tags "with_quic with_dhcp with_wireguard" \
              -o Libbox.xcframework \
              ./experimental/libbox

            mv Libbox.xcframework "$GITHUB_WORKSPACE/Frameworks/"
            cd "$GITHUB_WORKSPACE"
          fi

          if [ ! -d "Frameworks/Libbox.xcframework" ]; then
            echo "ERROR: Libbox.xcframework compilation failed!"
            exit 1
          fi
          echo ">>> Libbox.xcframework successfully built."

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Targets
        run: |
          # 1. 编译 PacketTunnel Network Extension Target
          xcodebuild clean build \
            -project StockScope.xcodeproj \
            -target PacketTunnel \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos

          # 2. 编译主 App Target
          xcodebuild build \
            -project StockScope.xcodeproj \
            -scheme StockScope \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos

      - name: Verify & Package IPA
        run: |
          APP_PATH="./build/Release-iphoneos/StockScope.app"
          EXT_PATH="./build/Release-iphoneos/PacketTunnel.appex"

          if [ ! -f "$APP_PATH/StockScope" ]; then
            echo "ERROR: StockScope executable not found in $APP_PATH!"
            ls -la "$APP_PATH"
            exit 1
          fi

          if [ ! -d "$EXT_PATH" ]; then
            echo "ERROR: PacketTunnel.appex not found in ./build/Release-iphoneos/!"
            exit 1
          fi

          lipo -info "$APP_PATH/StockScope"

          rm -rf Payload StockScope-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 注入 Network Extension
          mkdir -p "Payload/StockScope.app/PlugIns"
          cp -R "$EXT_PATH" "Payload/StockScope.app/PlugIns/"

          # 确保 index.html 存在于 App 根目录
          if [ -f "StockScope/index.html" ]; then
            cp "StockScope/index.html" "Payload/StockScope.app/"
          fi

          # 打包为 IPA
          zip -qry StockScope-unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockScope-unsigned-ipa
          path: StockScope-unsigned.ipa
          retention-days: 14

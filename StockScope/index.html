<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gemini Studio Pro — Apple HIG Orchestrator</title>
<style>
/* ==========================================================================
   1. APPLE HIG THEME SYSTEM (Frosted Glassmorphism, Vibrancy, San Francisco)
   ========================================================================== */
:root {
  --system-bg: #000000;
  --surface-translucent: rgba(28, 28, 30, 0.65);
  --surface-card: rgba(44, 44, 46, 0.55);
  --surface-card-hover: rgba(58, 58, 60, 0.7);
  --surface-elevated: rgba(36, 36, 38, 0.85);
  --surface-border: rgba(255, 255, 255, 0.12);
  --surface-highlight: rgba(255, 255, 255, 0.18);
  --surface-separator: rgba(255, 255, 255, 0.08);

  --apple-blue: #0A84FF;
  --apple-blue-rgb: 10, 132, 255;
  --apple-cyan: #64D2FF;
  --apple-green: #30D158;
  --apple-yellow: #FFD60A;
  --apple-orange: #FF9F0A;
  --apple-red: #FF453A;
  --apple-purple: #BF5AF2;
  --apple-indigo: #5E5CE6;
  
  --text-primary: #FFFFFF;
  --text-secondary: rgba(235, 235, 245, 0.6);
  --text-tertiary: rgba(235, 235, 245, 0.38);
  --text-quaternary: rgba(235, 235, 245, 0.2);

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-pill: 9999px;

  --spring-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  
  --sidebar-w: 280px;
  --header-h: 56px;
  --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SF Mono", Monaco, Menlo, Consolas, "Cascadia Code", monospace;
  
  --shadow-window: 0 40px 100px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--surface-border);
  --shadow-popup: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--system-bg);
  font-family: var(--font-stack);
  color: var(--text-primary);
  user-select: none;
}

/* Vibrancy Background Ambient */
.ambient-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(1000px 600px at 10% 10%, rgba(var(--apple-blue-rgb), 0.15), transparent 70%),
    radial-gradient(900px 500px at 90% 20%, rgba(191, 90, 242, 0.12), transparent 60%),
    radial-gradient(800px 800px at 50% 90%, rgba(48, 209, 88, 0.08), transparent 70%),
    linear-gradient(180deg, #090A0F 0%, #030407 100%);
}

.ambient-canvas::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* ==========================================================================
   2. APP CONTAINER & MASTER LAYOUT
   ========================================================================== */
#app {
  position: relative;
  z-index: 1;
  width: 100vw;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* Glass Surface Utility */
.glass {
  background: var(--surface-translucent);
  -webkit-backdrop-filter: blur(40px) saturate(190%);
  backdrop-filter: blur(40px) saturate(190%);
  border: 1px solid var(--surface-border);
  box-shadow: inset 0 1px 0 var(--surface-highlight);
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  height: 100%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--surface-separator);
  background: rgba(20, 20, 22, 0.6);
  backdrop-filter: blur(35px);
  transition: width 0.3s var(--spring-smooth);
  flex-shrink: 0;
  z-index: 10;
}

.sidebar-header {
  height: var(--header-h);
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--surface-separator);
}

.window-traffic-lights {
  display: flex;
  gap: 8px;
}

.traffic-light {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
  cursor: pointer;
}
.traffic-close { background: #FF5F56; border: 0.5px solid #E0443E; }
.traffic-min { background: #FFBD2E; border: 0.5px solid #DEA123; }
.traffic-max { background: #27C93F; border: 0.5px solid #1AAB29; }

.sidebar-nav {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
}

.nav-item.active {
  background: rgba(var(--apple-blue-rgb), 0.18);
  color: var(--apple-blue);
  box-shadow: inset 0 0 0 1px rgba(var(--apple-blue-rgb), 0.3);
}

.nav-item .icon {
  font-size: 16px;
  width: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.session-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  margin-top: 10px;
  padding: 0 12px 12px;
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  text-transform: uppercase;
  padding: 6px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.session-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.session-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.session-row:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-primary);
}

.session-row.active {
  background: rgba(255, 255, 255, 0.09);
  color: var(--text-primary);
  font-weight: 500;
}

.session-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-delete-btn {
  opacity: 0;
  transition: opacity 0.15s;
  color: var(--text-tertiary);
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 2px 4px;
  border-radius: var(--radius-xs);
}
.session-row:hover .session-delete-btn { opacity: 1; }
.session-delete-btn:hover { color: var(--apple-red); }

/* Main Stage */
.main-stage {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  background: rgba(14, 14, 16, 0.4);
}

/* Header / Title Bar */
.stage-header {
  height: var(--header-h);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--surface-separator);
  z-index: 5;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.status-capsule {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--surface-border);
  font-size: 11.5px;
  color: var(--text-secondary);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--apple-green);
  box-shadow: 0 0 8px var(--apple-green);
}

.status-dot.idle { background: var(--apple-green); box-shadow: 0 0 8px var(--apple-green); }
.status-dot.busy { background: var(--apple-yellow); box-shadow: 0 0 8px var(--apple-yellow); animation: pulse 1s infinite; }
.status-dot.error { background: var(--apple-red); box-shadow: 0 0 8px var(--apple-red); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Buttons (Apple HIG Tactile) */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--surface-border);
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.15s var(--spring-smooth);
  user-select: none;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-0.5px);
}

.btn:active {
  transform: translateY(0.5px) scale(0.98);
}

.btn-primary {
  background: var(--apple-blue);
  border-color: rgba(255, 255, 255, 0.3);
  color: #FFFFFF;
  box-shadow: 0 4px 14px rgba(var(--apple-blue-rgb), 0.35);
}

.btn-primary:hover {
  background: #2591FF;
  box-shadow: 0 6px 20px rgba(var(--apple-blue-rgb), 0.5);
}

.btn-danger {
  background: rgba(255, 69, 58, 0.15);
  border-color: rgba(255, 69, 58, 0.3);
  color: var(--apple-red);
}

.btn-danger:hover {
  background: rgba(255, 69, 58, 0.25);
}

.btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: var(--radius-sm);
}

/* View Canvas Stacks */
.view-viewport {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.view-panel {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  overflow-y: auto;
}

.view-panel.active {
  display: flex;
}

/* ==========================================================================
   3. CHAT VIEW (CONVERSATION & HIG CHAT BUBBLES)
   ========================================================================== */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.messages-scrollable {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.chat-bubble-wrap {
  display: flex;
  flex-direction: column;
  max-width: 82%;
  animation: bubblePop 0.25s var(--spring-smooth) forwards;
}

.chat-bubble-wrap.user {
  align-self: flex-end;
  align-items: flex-end;
}

.chat-bubble-wrap.model {
  align-self: flex-start;
  align-items: flex-start;
}

.chat-bubble-meta {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 4px;
}

.chat-bubble {
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  line-height: 1.6;
  position: relative;
  word-break: break-word;
  user-select: text;
}

.chat-bubble-wrap.user .chat-bubble {
  background: var(--apple-blue);
  color: #FFFFFF;
  border-bottom-right-radius: var(--radius-xs);
  box-shadow: 0 4px 12px rgba(var(--apple-blue-rgb), 0.25);
}

.chat-bubble-wrap.model .chat-bubble {
  background: var(--surface-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--surface-border);
  color: var(--text-primary);
  border-bottom-left-radius: var(--radius-xs);
}

.chat-bubble pre {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--surface-separator);
  padding: 12px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12.5px;
  margin: 8px 0;
}

.chat-bubble code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  background: rgba(255, 255, 255, 0.08);
  padding: 2px 5px;
  border-radius: 4px;
}

/* Chat Input Bar */
.chat-dock {
  padding: 16px 24px 20px;
  background: linear-gradient(180deg, transparent 0%, rgba(10, 10, 12, 0.9) 100%);
}

.chat-input-wrapper {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl);
  padding: 8px 12px 8px 18px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  box-shadow: var(--shadow-popup);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.chat-input-wrapper:focus-within {
  border-color: rgba(var(--apple-blue-rgb), 0.5);
  box-shadow: 0 0 0 3px rgba(var(--apple-blue-rgb), 0.2), var(--shadow-popup);
}

.chat-textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.4;
  resize: none;
  max-height: 160px;
  min-height: 24px;
  padding: 4px 0;
}

.chat-textarea::placeholder {
  color: var(--text-tertiary);
}

/* ==========================================================================
   4. PIPELINE ORCHESTRATOR VIEW (DAG / SEQUENTIAL MULTI-STAGE ENGINE)
   ========================================================================== */
.pipeline-view {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.pipeline-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-card);
  padding: 18px 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--surface-border);
}

.pipeline-hero-text h2 {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 4px;
}

.pipeline-hero-text p {
  font-size: 13px;
  color: var(--text-secondary);
}

.pipeline-stages-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
}

.pipeline-node {
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: all 0.2s var(--spring-smooth);
  position: relative;
}

.pipeline-node.running {
  border-color: var(--apple-blue);
  box-shadow: 0 0 20px rgba(var(--apple-blue-rgb), 0.25);
}

.pipeline-node.done {
  border-color: var(--apple-green);
}

.pipeline-node-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.node-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
}

.node-idx {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}

.node-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pipeline-node-body {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 14px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.input-text, .input-select, .input-textarea {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}

.input-textarea {
  font-family: var(--font-mono);
  font-size: 12px;
  resize: vertical;
  min-height: 60px;
}

.input-text:focus, .input-select:focus, .input-textarea:focus {
  border-color: var(--apple-blue);
}

.node-output-preview {
  background: rgba(0, 0, 0, 0.4);
  border: 1px dashed var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-size: 12px;
  color: var(--text-secondary);
  max-height: 120px;
  overflow-y: auto;
  white-space: pre-wrap;
  font-family: var(--font-mono);
}

/* Pipeline Connector Cable Visualizer */
.pipeline-connector {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 20px;
  color: var(--text-tertiary);
  font-size: 16px;
}

/* ==========================================================================
   5. POOL MANAGEMENT & SETTINGS MODAL (APPLE SHEET)
   ========================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(20px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
  animation: fadeIn 0.2s ease forwards;
}

.modal-sheet {
  width: 100%;
  max-width: 640px;
  max-height: 85vh;
  background: var(--surface-elevated);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-window);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: sheetPop 0.3s var(--spring-smooth) forwards;
}

.modal-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--surface-separator);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-header h3 {
  font-size: 16px;
  font-weight: 600;
}

.modal-body {
  padding: 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.api-pool-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-card);
  border: 1px solid var(--surface-border);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
}

.api-pool-item .key-preview {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--text-secondary);
}

.key-health-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  text-transform: uppercase;
}
.key-health-tag.valid { background: rgba(48, 209, 88, 0.2); color: var(--apple-green); }
.key-health-tag.invalid { background: rgba(255, 69, 58, 0.2); color: var(--apple-red); }
.key-health-tag.unchecked { background: rgba(255, 255, 255, 0.1); color: var(--text-tertiary); }

/* ==========================================================================
   6. METRICS & TELEMETRY TOAST
   ========================================================================== */
.toast-manager {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background: var(--surface-elevated);
  border: 1px solid var(--surface-border);
  box-shadow: var(--shadow-popup);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  animation: toastIn 0.3s var(--spring-smooth) forwards;
}

/* Animations */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetPop { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes bubblePop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Scrollbar refinement */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }
</style>
</head>
<body>

<div class="ambient-canvas"></div>

<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="window-traffic-lights">
        <span class="traffic-light traffic-close" title="Close"></span>
        <span class="traffic-light traffic-min" title="Minimize"></span>
        <span class="traffic-light traffic-max" title="Maximize"></span>
      </div>
      <button class="btn btn-icon" id="btnNewSession" title="New Chat (⌘N)">＋</button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-item active" data-view="chatView">
        <span class="icon">💬</span>
        <span>Studio Chat</span>
      </div>
      <div class="nav-item" data-view="pipelineView">
        <span class="icon">⚡️</span>
        <span>Pipeline Matrix</span>
      </div>
    </nav>

    <div class="session-section">
      <div class="section-label">
        <span>Conversations</span>
        <span id="sessionCount">0</span>
      </div>
      <div class="session-list" id="sessionList"></div>
    </div>

    <div style="padding: 12px; border-top: 1px solid var(--surface-separator);">
      <button class="btn" style="width: 100%; justify-content: flex-start;" id="btnOpenSettings">
        <span class="icon">⚙️</span>
        <span>API Keys & Pools</span>
      </button>
    </div>

<!-- ==========================================================================
   7. CORE ENGINE JAVASCRIPT LOGIC
   ========================================================================== -->
<script>
/**
 * GEMINI STUDIO ARCHITECTURE ENGINE
 * Single-file reactive state store, multi-key round-robin scheduler,
 * sequential pipeline dispatcher, and Apple-grade renderer.
 */

// Global State
const Store = {
  activeView: 'chatView',
  sessions: [],
  activeSessionId: null,
  apiKeys: [],
  currentKeyIndex: 0,
  defaultModel: 'gemini-2.5-flash',
  modelsRegistry: [
    'gemini-2.5-flash',
    'gemini-2.5-pro',
    'gemini-2.0-flash',
    'gemini-2.0-flash-lite'
  ],
  pipelineStages: [
    {
      id: 'stg_1',
      title: 'Phase 1: Analysis & Extraction',
      model: 'gemini-2.5-flash',
      systemPrompt: 'You are a meticulous analyst. Extract key facts, issues, and constraints from the input.',
      temperature: 0.2,
      lastOutput: ''
    },
    {
      id: 'stg_2',
      title: 'Phase 2: Solution Architecture',
      model: 'gemini-2.5-flash',
      systemPrompt: 'You are a senior solutions engineer. Based on the analysis, design a clean, optimal solution.',
      temperature: 0.4,
      lastOutput: ''
    },
    {
      id: 'stg_3',
      title: 'Phase 3: Code & Verification Matrix',
      model: 'gemini-2.5-pro',
      systemPrompt: 'You are a QA and code architect. Review previous steps and output the complete production-grade result.',
      temperature: 0.1,
      lastOutput: ''
    }
  ]
};

// Persistence Handlers
function saveStore() {
  localStorage.setItem('GEMINI_STUDIO_STORE_V1', JSON.stringify({
    sessions: Store.sessions,
    activeSessionId: Store.activeSessionId,
    apiKeys: Store.apiKeys,
    defaultModel: Store.defaultModel,
    pipelineStages: Store.pipelineStages
  }));
}

function loadStore() {
  try {
    const raw = localStorage.getItem('GEMINI_STUDIO_STORE_V1');
    if (raw) {
      const parsed = JSON.parse(raw);
      Store.sessions = parsed.sessions || [];
      Store.activeSessionId = parsed.activeSessionId || null;
      Store.apiKeys = parsed.apiKeys || [];
      Store.defaultModel = parsed.defaultModel || 'gemini-2.5-flash';
      Store.pipelineStages = parsed.pipelineStages || Store.pipelineStages;
    }
  } catch (err) {
    console.error('Failed to load store from local storage:', err);
  }

  if (Store.sessions.length === 0) {
    createNewSession('General Conversation');
  } else if (!Store.activeSessionId || !Store.sessions.find(s => s.id === Store.activeSessionId)) {
    Store.activeSessionId = Store.sessions[0].id;
  }
}

// Key Pool Load Balancer
function getNextAvailableApiKey() {
  if (!Store.apiKeys || Store.apiKeys.length === 0) {
    throw new Error('No Gemini API Key found. Please add a valid API key in Settings.');
  }
  const activeKeyObj = Store.apiKeys[Store.currentKeyIndex % Store.apiKeys.length];
  Store.currentKeyIndex++;
  return activeKeyObj.key;
}

// Toast Notifier
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  
  let icon = 'ℹ️';
  if (type === 'success') icon = '✅';
  if (type === 'error') icon = '❌';
  if (type === 'warn') icon = '⚠️';

  toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

// Gemini Raw API Service
async function callGeminiApi({ model, contents, systemInstruction, temperature = 0.7 }) {
  const apiKey = getNextAvailableApiKey();
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;

  const payload = {
    contents: contents,
    generationConfig: {
      temperature: parseFloat(temperature),
      maxOutputTokens: 8192
    }
  };

  if (systemInstruction) {
    payload.systemInstruction = {
      parts: [{ text: systemInstruction }]
    };
  }

  const response = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    const errorDetails = await response.text();
    throw new Error(`API Error [HTTP ${response.status}]: ${errorDetails}`);
  }

  const data = await response.json();
  const textOutput = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
  return textOutput;
}

// Session Management
function createNewSession(title = 'New Conversation') {
  const newSession = {
    id: 'ses_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
    title: title,
    createdAt: new Date().toISOString(),
    messages: [
      {
        role: 'model',
        text: 'Hello! I am connected to the Gemini API engine. How can I assist your workflow today?',
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
    ]
  };
  Store.sessions.unshift(newSession);
  Store.activeSessionId = newSession.id;
  saveStore();
  renderSessionList();
  renderActiveChat();
}

function deleteSession(id, event) {
  if (event) event.stopPropagation();
  if (Store.sessions.length <= 1) {
    showToast('Cannot delete the last remaining session.', 'warn');
    return;
  }
  Store.sessions = Store.sessions.filter(s => s.id !== id);
  if (Store.activeSessionId === id) {
    Store.activeSessionId = Store.sessions[0].id;
  }
  saveStore();
  renderSessionList();
  renderActiveChat();
  showToast('Session deleted.', 'info');
}

function getActiveSession() {
  return Store.sessions.find(s => s.id === Store.activeSessionId);
}

// UI Renderers
function renderSessionList() {
  const container = document.getElementById('sessionList');
  container.innerHTML = '';
  document.getElementById('sessionCount').textContent = Store.sessions.length;

  Store.sessions.forEach(session => {
    const row = document.createElement('div');
    row.className = `session-row ${session.id === Store.activeSessionId ? 'active' : ''}`;
    row.onclick = () => {
      Store.activeSessionId = session.id;
      saveStore();
      renderSessionList();
      renderActiveChat();
    };

    row.innerHTML = `
      <div class="session-title-wrap">
        <span>💬</span>
        <span style="overflow: hidden; text-overflow: ellipsis;">${session.title}</span>
      </div>
      <button class="session-delete-btn" title="Delete">✕</button>
    `;

    row.querySelector('.session-delete-btn').onclick = (e) => deleteSession(session.id, e);
    container.appendChild(row);
  });
}

function renderActiveChat() {
  const session = getActiveSession();
  const container = document.getElementById('messagesContainer');
  container.innerHTML = '';
  if (!session) return;

  session.messages.forEach(msg => {
    const wrap = document.createElement('div');
    wrap.className = `chat-bubble-wrap ${msg.role}`;
    
    wrap.innerHTML = `
      <div class="chat-bubble-meta">
        <span>${msg.role === 'user' ? 'You' : 'Gemini'}</span>
        <span>•</span>
        <span>${msg.timestamp || ''}</span>
      </div>
      <div class="chat-bubble">${formatMarkdownToHtml(msg.text)}</div>
    `;
    container.appendChild(wrap);
  });

  container.scrollTop = container.scrollHeight;
}

function formatMarkdownToHtml(text) {
  if (!text) return '';
  let esc = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  
  // Format code blocks
  esc = esc.replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Format inline code
  esc = esc.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold & Italic
  esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  esc = esc.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // Line breaks
  return esc.replace(/\n/g, '<br>');
}

// Chat Dispatcher
async function handleSendMessage() {
  const input = document.getElementById('chatInput');
  const userText = input.value.trim();
  if (!userText) return;

  const session = getActiveSession();
  if (!session) return;

  // Add User Message
  session.messages.push({
    role: 'user',
    text: userText,
    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });

  if (session.messages.length === 2) {
    session.title = userText.slice(0, 24) + (userText.length > 24 ? '...' : '');
    renderSessionList();
  }

  input.value = '';
  input.style.height = 'auto';
  renderActiveChat();

  setGlobalStatus('busy', 'Gemini Thinking...');

  try {
    const historyPayload = session.messages.map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.text }]
    }));

    const reply = await callGeminiApi({
      model: Store.defaultModel,
      contents: historyPayload
    });

    session.messages.push({
      role: 'model',
      text: reply,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });

    saveStore();
    renderActiveChat();
    setGlobalStatus('idle', 'Gemini Ready');
  } catch (err) {
    setGlobalStatus('error', 'Error');
    showToast(err.message, 'error');
    session.messages.push({
      role: 'model',
      text: `⚠️ **Error Generating Response:** ${err.message}`,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });
    renderActiveChat();
  }
}

// Pipeline View Logic
function renderPipelineStages() {
  const container = document.getElementById('pipelineStagesList');
  container.innerHTML = '';

  Store.pipelineStages.forEach((stage, idx) => {
    if (idx > 0) {
      const conn = document.createElement('div');
      conn.className = 'pipeline-connector';
      conn.textContent = '↓';
      container.appendChild(conn);
    }

    const node = document.createElement('div');
    node.className = 'pipeline-node';
    node.id = `node_${stage.id}`;

    node.innerHTML = `
      <div class="pipeline-node-header">
        <div class="node-badge">
          <span class="node-idx">${idx + 1}</span>
          <span>${stage.title}</span>
        </div>
        <div class="node-controls">
          <button class="btn btn-danger btn-icon" onclick="deletePipelineStage(${idx})" title="Remove Stage">✕</button>
        </div>
      </div>
      <div class="pipeline-node-body">
        <div class="field-group">
          <label class="field-label">Model Endpoint</label>
          <select class="input-select" onchange="updateStageModel(${idx}, this.value)">
            ${Store.modelsRegistry.map(m => `<option value="${m}" ${m === stage.model ? 'selected' : ''}>${m}</option>`).join('')}
          </select>
          <label class="field-label" style="margin-top: 6px;">Temperature</label>
          <input type="number" step="0.1" min="0" max="1" class="input-text" value="${stage.temperature}" onchange="updateStageTemp(${idx}, this.value)">
        </div>
        <div class="field-group">
          <label class="field-label">System Instruction & Task</label>
          <textarea class="input-textarea" onchange="updateStagePrompt(${idx}, this.value)">${stage.systemPrompt}</textarea>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Stage Output Cache</label>
        <div class="node-output-preview">${stage.lastOutput || 'Stage has not run yet.'}</div>
      </div>
    `;
    container.appendChild(node);
  });
}

function updateStageModel(index, val) { Store.pipelineStages[index].model = val; saveStore(); }
function updateStageTemp(index, val) { Store.pipelineStages[index].temperature = parseFloat(val); saveStore(); }
function updateStagePrompt(index, val) { Store.pipelineStages[index].systemPrompt = val; saveStore(); }

function deletePipelineStage(index) {
  if (Store.pipelineStages.length <= 1) {
    showToast('At least one pipeline stage is required.', 'warn');
    return;
  }
  Store.pipelineStages.splice(index, 1);
  saveStore();
  renderPipelineStages();
}

async function executePipeline() {
  const rootInput = document.getElementById('pipelineInitialPayload').value.trim();
  if (!rootInput) {
    showToast('Please provide an initial payload for the pipeline.', 'warn');
    return;
  }

  setGlobalStatus('busy', 'Running Pipeline...');
  let rollingPayload = rootInput;

  for (let i = 0; i < Store.pipelineStages.length; i++) {
    const stage = Store.pipelineStages[i];
    const nodeElem = document.getElementById(`node_${stage.id}`);
    
    if (nodeElem) {
      nodeElem.classList.add('running');
      nodeElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    try {
      const output = await callGeminiApi({
        model: stage.model,
        systemInstruction: stage.systemPrompt,
        temperature: stage.temperature,
        contents: [
          {
            role: 'user',
            parts: [{ text: `INPUT PAYLOAD FROM PREVIOUS STEP:\n\n${rollingPayload}` }]
          }
        ]
      });

      stage.lastOutput = output;
      rollingPayload = output; // Hand off to subsequent node

      if (nodeElem) {
        nodeElem.classList.remove('running');
        nodeElem.classList.add('done');
        nodeElem.querySelector('.node-output-preview').textContent = output;
      }
    } catch (err) {
      if (nodeElem) nodeElem.classList.remove('running');
      setGlobalStatus('error', 'Pipeline Error');
      showToast(`Stage ${i + 1} Failed: ${err.message}`, 'error');
      return;
    }
  }

  saveStore();
  setGlobalStatus('idle', 'Pipeline Completed');
  showToast('Pipeline execution finished successfully!', 'success');
}

// API Key Pool Management
function renderApiKeyPool() {
  const container = document.getElementById('apiKeyPoolList');
  container.innerHTML = '';

  if (Store.apiKeys.length === 0) {
    container.innerHTML = '<div style="color: var(--text-tertiary); font-size: 13px;">No keys configured. API calls will fail.</div>';
    return;
  }

  Store.apiKeys.forEach((keyObj, idx) => {
    const row = document.createElement('div');
    row.className = 'api-pool-item';
    const masked = keyObj.key.slice(0, 6) + '••••••••••••' + keyObj.key.slice(-4);
    row.innerHTML = `
      <span class="key-preview">${masked}</span>
      <span class="key-health-tag valid">Active</span>
      <button class="btn btn-danger btn-icon" style="width: 24px; height: 24px;" onclick="removeApiKey(${idx})">✕</button>
    `;
    container.appendChild(row);
  });
}

function addApiKey() {
  const input = document.getElementById('inputNewApiKey');
  const val = input.value.trim();
  if (!val) return;
  if (!val.startsWith('AIza')) {
    showToast('Notice: Gemini API keys generally begin with "AIza"', 'warn');
  }

  Store.apiKeys.push({ key: val, addedAt: new Date().toISOString() });
  input.value = '';
  saveStore();
  renderApiKeyPool();
  showToast('API Key added to load balancer.', 'success');
}

function removeApiKey(index) {
  Store.apiKeys.splice(index, 1);
  saveStore();
  renderApiKeyPool();
}

async function fetchOnlineModels() {
  if (Store.apiKeys.length === 0) {
    showToast('Add an API Key first to discover available models.', 'warn');
    return;
  }
  showToast('Connecting to Google Model Discovery API...', 'info');
  try {
    const key = Store.apiKeys[0].key;
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    
    const geminiModels = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace(/^models\//, ''));

    if (geminiModels.length > 0) {
      Store.modelsRegistry = geminiModels;
      const select = document.getElementById('selectDefaultModel');
      select.innerHTML = geminiModels.map(m => `<option value="${m}">${m}</option>`).join('');
      select.value = geminiModels.includes('gemini-2.5-flash') ? 'gemini-2.5-flash' : geminiModels[0];
      renderPipelineStages();
      showToast(`Discovered ${geminiModels.length} models successfully!`, 'success');
    }
  } catch (err) {
    showToast(`Model Discovery Failed: ${err.message}`, 'error');
  }
}

// Global Indicator Helper
function setGlobalStatus(state, label) {
  const dot = document.getElementById('globalStatusDot');
  const text = document.getElementById('globalStatusText');
  dot.className = `status-dot ${state}`;
  text.textContent = label;
}

// Export Session Dialog
function exportCurrentSession() {
  const session = getActiveSession();
  if (!session) return;
  const blob = new Blob([JSON.stringify(session, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Gemini_Session_${session.title.replace(/[^a-z0-9]/gi, '_')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Session exported to JSON.', 'success');
}

// Lifecycle Initialization
window.addEventListener('DOMContentLoaded', () => {
  loadStore();
  renderSessionList();
  renderActiveChat();
  renderPipelineStages();
  renderApiKeyPool();

  // Navigation Switching
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      item.classList.add('active');
      const viewId = item.dataset.view;
      document.getElementById(viewId).classList.add('active');
      document.getElementById('stageTitle').textContent = viewId === 'chatView' ? 'Studio Chat' : 'Pipeline Orchestrator';
    });
  });

  // Settings Modal Handlers
  document.getElementById('btnOpenSettings').onclick = () => document.getElementById('settingsModal').classList.add('active');
  document.getElementById('btnCloseSettings').onclick = () => document.getElementById('settingsModal').classList.remove('active');
  document.getElementById('btnAddApiKey').onclick = addApiKey;
  document.getElementById('btnSyncOnlineModels').onclick = fetchOnlineModels;

  // Session Toolbar
  document.getElementById('btnNewSession').onclick = () => createNewSession();
  document.getElementById('btnExportSession').onclick = exportCurrentSession;
  document.getElementById('btnClearCurrentChat').onclick = () => {
    const session = getActiveSession();
    if (session) {
      session.messages = [];
      saveStore();
      renderActiveChat();
      showToast('Conversation context cleared.', 'info');
    }
  };

  // Pipeline Toolbar
  document.getElementById('btnAddPipelineStage').onclick = () => {
    Store.pipelineStages.push({
      id: 'stg_' + Date.now(),
      title: `Phase ${Store.pipelineStages.length + 1}: Refinement Stage`,
      model: Store.defaultModel,
      systemPrompt: 'Refine and improve the previous output with precision.',
      temperature: 0.3,
      lastOutput: ''
    });
    saveStore();
    renderPipelineStages();
  };
  document.getElementById('btnRunPipeline').onclick = executePipeline;

  // Chat Input Auto-Resize & Enter to Send
  const chatInput = document.getElementById('chatInput');
  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + 'px';
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSendMessage();
    }
  });

  document.getElementById('btnSendMessage').onclick = handleSendMessage;
});
</script>

name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch: {}    # 允许手动触发(在 GitHub 网页点击 Run workflow)

jobs:
  build-ipa:
    name: Build unsigned StockScope IPA
    runs-on: macos-15        # 2026 年最新 macOS runner,自带 Xcode 16+
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
      # 若上面路径不存在(Apple 升级 Xcode 后路径会变),用下面这行兜底,会自动选最新
      - name: 选择 Xcode 版本(兜底)
        if: failure()
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      # 无签名归档:CODE_SIGNING_ALLOWED=NO 跳过所有签名
      - name: 归档(archive,不签名)
        run: |
          xcodebuild \
            -project "StockScope.xcodeproj" \
            -scheme "StockScope" \
            -configuration "Release" \
            -destination "generic/platform=iOS" \
            -archivePath "build/StockScope.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # 无签名时无法走 xcodebuild -exportArchive,直接从 xcarchive 提取 .app 手动打包
      - name: 打包 IPA(未签名)
        run: |
          set -euo pipefail
          APP_PATH="build/StockScope.xcarchive/Products/Applications/StockScope.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到 $APP_PATH,归档可能失败"
            ls -R build/StockScope.xcarchive/Products 2>/dev/null || true
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry StockScope-unsigned.ipa Payload/
          cd ..
          rm -rf build/Payload
          ls -lh build/StockScope-unsigned.ipa

      - name: 上传 IPA 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StockScope-IPA
          path: build/StockScope-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
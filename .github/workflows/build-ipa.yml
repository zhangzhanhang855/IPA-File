name: Build and Package StockScope IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen 并生成工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive 编译应用
        run: |
          PROJECT_NAME=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)
          
          # 1. 编译生成标准 .xcarchive
          xcodebuild archive \
            -project "$PROJECT_NAME" \
            -scheme StockScope \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/StockScope.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 提取完整 App 并规范打包 IPA
        run: |
          # 2. 定位 xcarchive 内生成的标准可执行 App 目录
          APP_PATH="./build/StockScope.xcarchive/Products/Applications/StockScope.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未在 xcarchive 中找到 StockScope.app！"
            exit 1
          fi

          echo "验证 App 主二进制文件..."
          ls -la "$APP_PATH"

          # 3. 构造干净的 Payload 结构
          rm -rf Payload StockScope_unsigned.ipa
          mkdir Payload
          cp -RH "$APP_PATH" Payload/

          # 4. 压缩为标准 IPA
          zip -r -y StockScope_unsigned.ipa Payload/

      - name: 上传 IPA 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StockScope_unsigned.ipa
          path: StockScope_unsigned.ipa
          retention-days: 7

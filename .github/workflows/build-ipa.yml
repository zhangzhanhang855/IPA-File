name: Build and Package StockScope IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen 并生成工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 编译 iOS App (无签名)
        run: |
          # 查找生成的 xcodeproj 文件名
          PROJECT_NAME=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)
          
          # 编译成 Release 架构的 .app
          xcodebuild clean build \
            -project "$PROJECT_NAME" \
            -scheme StockScope \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 提取 .app 并打包为未签名 IPA
        run: |
          mkdir -p Payload
          
          # 从编译产物中找到 StockScope.app 并复制到 Payload
          APP_DIR=$(find ./build -name "*.app" -type d -print -quit)
          
          if [ -z "$APP_DIR" ]; then
            echo "::error::编译失败，未找到生成的 .app 文件！"
            exit 1
          fi
          
          echo "找到编译产物: $APP_DIR"
          cp -RH "$APP_DIR" Payload/
          
          # 压缩为 IPA
          zip -r -y StockScope_unsigned.ipa Payload/

      - name: 上传 IPA 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StockScope-unsigned-ipa
          path: StockScope_unsigned.ipa
          retention-days: 7

name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Tools
        run: |
          brew install xcodegen

      # 从 sing-box-for-apple 仓库拉取最新预编译的 Libbox.xcframework.zip
      - name: Setup Libbox Core Framework
        run: |
          mkdir -p Frameworks
          if [ ! -d "Frameworks/Libbox.xcframework" ]; then
            echo ">>> Fetching Libbox.xcframework from sing-box-for-apple..."
            
            # 使用 GitHub API 自动匹配并下载最新的 Libbox.xcframework.zip
            DOWNLOAD_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box-for-apple/releases/latest \
              | grep "browser_download_url.*Libbox.xcframework.zip" \
              | cut -d : -f 2,3 \
              | tr -d '\" ')
            
            echo ">>> Target URL: $DOWNLOAD_URL"
            curl -L -o Libbox.xcframework.zip "$DOWNLOAD_URL"
            
            # 校验是否为有效 zip 文件
            if ! file Libbox.xcframework.zip | grep -q "Zip archive"; then
              echo "ERROR: Downloaded file is not a valid zip archive! Response content:"
              cat Libbox.xcframework.zip
              exit 1
            fi

            unzip -q Libbox.xcframework.zip -d Frameworks/
            rm -f Libbox.xcframework.zip
          fi

          if [ ! -d "Frameworks/Libbox.xcframework" ]; then
            echo "ERROR: Libbox.xcframework does not exist!"
            exit 1
          fi
          echo ">>> Libbox.xcframework successfully installed."

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Targets
        run: |
          # 1. 编译 PacketTunnel Network Extension Target
          xcodebuild clean build \
            -project StockScope.xcodeproj \
            -target PacketTunnel \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos

          # 2. 编译主 App Target
          xcodebuild build \
            -project StockScope.xcodeproj \
            -scheme StockScope \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=./build/Release-iphoneos

      - name: Verify & Package IPA
        run: |
          APP_PATH="./build/Release-iphoneos/StockScope.app"
          EXT_PATH="./build/Release-iphoneos/PacketTunnel.appex"

          if [ ! -f "$APP_PATH/StockScope" ]; then
            echo "ERROR: StockScope executable not found in $APP_PATH!"
            ls -la "$APP_PATH"
            exit 1
          fi

          if [ ! -d "$EXT_PATH" ]; then
            echo "ERROR: PacketTunnel.appex not found in ./build/Release-iphoneos/!"
            exit 1
          fi

          lipo -info "$APP_PATH/StockScope"

          rm -rf Payload StockScope-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # 确保将 Network Extension 放入主包的 PlugIns 目录
          mkdir -p "Payload/StockScope.app/PlugIns"
          cp -R "$EXT_PATH" "Payload/StockScope.app/PlugIns/"

          # 确保前端 index.html 存在于 App 根目录
          if [ -f "StockScope/index.html" ]; then
            cp "StockScope/index.html" "Payload/StockScope.app/"
          fi

          # 压缩为标准 IPA 结构
          zip -qry StockScope-unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockScope-unsigned-ipa
          path: StockScope-unsigned.ipa
          retention-days: 14

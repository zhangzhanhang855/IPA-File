name: Build Unsigned sing-box IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV

      - name: Install gomobile & tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Clone sing-box core
        run: |
          git clone --depth=1 https://github.com/SagerNet/sing-box.git /tmp/sing-box

      - name: Build Libbox.xcframework
        working-directory: /tmp/sing-box
        run: |
          go mod tidy
          go get golang.org/x/mobile/cmd/gobind
          gomobile bind \
            -v \
            -target=ios \
            -tags="with_clash_api,with_quic,with_wireguard" \
            -o /tmp/Libbox.xcframework \
            ./experimental/libbox

      - name: Clone sing-box-for-apple
        run: |
          git clone --depth=1 --recursive https://github.com/SagerNet/sing-box-for-apple.git /tmp/sing-box-for-apple

      - name: Copy Libbox.xcframework to Project
        run: |
          mkdir -p /tmp/sing-box-for-apple/Frameworks
          cp -r /tmp/Libbox.xcframework /tmp/sing-box-for-apple/Frameworks/
          cp -r /tmp/Libbox.xcframework /tmp/sing-box-for-apple/

      - name: Build and Package Unsigned IPA
        working-directory: /tmp/sing-box-for-apple
        run: |
          TARGET_SCHEME=$(xcodebuild -project sing-box.xcodeproj -list | awk '/Schemes:/{flag=1;next} flag && /iOS/{print $1; exit}')
          if [ -z "$TARGET_SCHEME" ]; then
            TARGET_SCHEME="SFM"
          fi
          echo "Building with Scheme: $TARGET_SCHEME"

          # 增加 -skipPackagePluginValidation 繞過 SwiftLint 驗證彈窗
          xcodebuild build \
            -project sing-box.xcodeproj \
            -scheme "$TARGET_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d -maxdepth 1 | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -9 /tmp/sing-box-unsigned.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-unsigned-ipa
          path: /tmp/sing-box-unsigned.ipa
          retention-days: 7

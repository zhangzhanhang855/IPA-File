name: Build Libbox.xcframework

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV

      - name: Install gomobile & tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Clone sing-box
        run: |
          git clone --depth=1 https://github.com/SagerNet/sing-box.git /tmp/sing-box

      - name: Build Libbox.xcframework
        working-directory: /tmp/sing-box
        run: |
          # 1. 補全專案本身的常規模組依賴
          go mod tidy
          # 2. 注入 gomobile 所需的依賴（避免 missing golang.org/x/mobile dependency 報錯）
          go get golang.org/x/mobile/cmd/gobind
          # 3. 編譯 Framework（已移除已棄用的 with_ech）
          gomobile bind \
            -v -x \
            -target=ios,iossimulator \
            -tags="with_clash_api,with_quic,with_wireguard" \
            -o Libbox.xcframework \
            ./experimental/libbox

      - name: Compress Framework
        working-directory: /tmp/sing-box
        run: |
          zip -r -9 Libbox.xcframework.zip Libbox.xcframework

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libbox.xcframework
          path: /tmp/sing-box/Libbox.xcframework.zip
          retention-days: 7

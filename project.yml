name: StockScope
options:
  bundleIdPrefix: com.yourdomain
targets:
  StockScope:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [StockScope]
    dependencies:
      - target: PacketTunnel

  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources: [PacketTunnel]
    dependencies:
      - framework: Libbox.xcframework
    info:
      path: PacketTunnel/Info.plist
